<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omhenaka Care Foundation — Developing the Mind and Land of the People</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green-dark:#0b4a2e;
    --green:#146c43;
    --navy:#152a54;
    --gold:#e2a025;
    --red:#d43b3b;
    --purple:#8a4fc9;
    --teal:#1aa3a3;
    --leaf:#3f9142;
    --cream:#f4f1ea;
    --ink:#182131;
    --muted:#5b667a;
    --line:#e7e4db;
    --radius:12px;
    --shadow:0 10px 26px -12px rgba(11,74,46,0.22);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{color:var(--ink); background:#fff; font-family:'Inter', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased;}
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
  :focus-visible{outline:2px solid var(--green); outline-offset:3px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important; transition-duration:.001s !important;} }

  .reveal{opacity:0; transform:translateY(22px); transition:opacity .6s var(--ease), transform .6s var(--ease); transition-delay:var(--delay,0s);}
  .reveal.in{opacity:1; transform:translateY(0);}
  .reveal-left{opacity:0; transform:translateX(-32px); transition:opacity .65s var(--ease), transform .65s var(--ease); transition-delay:var(--delay,0s);}
  .reveal-left.in{opacity:1; transform:translateX(0);}
  .reveal-right{opacity:0; transform:translateX(32px); transition:opacity .65s var(--ease), transform .65s var(--ease); transition-delay:var(--delay,0s);}
  .reveal-right.in{opacity:1; transform:translateX(0);}
  .reveal-scale{opacity:0; transform:scale(.94) translateY(14px); transition:opacity .6s var(--ease), transform .6s var(--ease); transition-delay:var(--delay,0s);}
  .reveal-scale.in{opacity:1; transform:scale(1) translateY(0);}

  .scroll-progress{position:fixed; top:0; left:0; height:3px; background:linear-gradient(90deg,var(--green),var(--gold)); width:0%; z-index:300; transition:width .1s linear;}

  header.main.scrolled{box-shadow:0 6px 22px -14px rgba(11,74,46,.35);}
  header.main{transition:box-shadow .3s var(--ease);}

  /* tap / hover feedback everywhere, tuned for touch too */
  .btn, .donate-btn, .pillar-card, .stat, .cta-item, .footer-social a, .topbar-social a, .split-panel{
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active, .donate-btn:active{ transform:scale(.96); }
  .pillar-card{ will-change:transform; }
  .pillar-card:active{ transform:translateY(-2px) scale(.98); }
  .stat{ transition:transform .3s var(--ease); }
  .cta-item{ transition:transform .25s var(--ease), background .25s var(--ease); }
  .cta-item:hover, .cta-item:active{ transform:translateY(-3px); background:rgba(255,255,255,.03); }
  .footer-social a:active, .topbar-social a:active{ transform:scale(.9); }

  @keyframes floatY{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
  @keyframes pulseRing{ 0%{ box-shadow:0 0 0 0 rgba(20,108,67,.35); } 100%{ box-shadow:0 0 0 14px rgba(20,108,67,0); } }
  .donate-btn{ position:relative; }
  .donate-btn::after{ content:""; position:absolute; inset:0; border-radius:8px; animation:pulseRing 2.6s ease-out infinite; pointer-events:none; }

  /* ---------- Topbar ---------- */
  .topbar{background:var(--green-dark); color:#eaf3ec; font-size:13px;}
  .topbar .wrap{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 24px;}
  .topbar-left{display:flex; gap:22px; align-items:center;}
  .topbar-left span{display:inline-flex; align-items:center; gap:7px; opacity:.95;}
  .topbar-left svg{width:13px; height:13px; opacity:.85; flex-shrink:0;}
  .topbar-social{display:flex; gap:12px;}
  .topbar-social a{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;transition:background .2s var(--ease);}
  .topbar-social a:hover{background:rgba(255,255,255,.28);}
  .topbar-social svg{width:12px; height:12px;}

  /* ---------- Header ---------- */
  header.main{background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:200;}
  .nav-row{display:flex; align-items:center; justify-content:space-between; padding:14px 24px; gap:20px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:50px;height:50px;border-radius:50%;background:var(--green-dark);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0;}
  .brand-text .name{font-weight:800; color:var(--navy); font-size:18px; line-height:1.15; letter-spacing:.1px;}
  .brand-text .name .accent{color:var(--green);}
  .brand-text .tag{font-size:11px; color:var(--muted); font-style:italic; margin-top:1px;}

  nav.primary{display:flex; align-items:center; gap:28px;}
  nav.primary ul{display:flex; gap:26px; align-items:center;}
  nav.primary a.navlink{font-size:14px; font-weight:600; color:#2b3242; padding:6px 0; position:relative;}
  nav.primary a.navlink.active{color:var(--green);}
  nav.primary a.navlink.active::after{content:"";position:absolute;left:0;right:0;bottom:-16px;height:3px;background:var(--green);}
  .has-caret svg{width:9px; height:9px; margin-left:5px; vertical-align:1px; opacity:.7;}
  .donate-btn{background:var(--navy); color:#fff; padding:11px 22px; border-radius:8px; font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:8px; border:none; white-space:nowrap; transition:background .2s var(--ease);}
  .donate-btn:hover{background:#1e3a70;}
  .donate-btn svg{width:15px; height:15px;}

  .menu-toggle{display:none; background:none; border:none; padding:6px; z-index:210;}
  .menu-toggle svg{width:26px; height:26px;}

  .nav-overlay{display:none; position:fixed; inset:0; background:rgba(10,20,15,.4); z-index:150; opacity:0; transition:opacity .3s var(--ease);}
  .nav-overlay.open{display:block; opacity:1;}

  /* ---------- Hero ---------- */
  .hero{background:var(--cream);}
  .hero-grid{display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center; padding:56px 24px 64px;}
  .hero h1{font-size:2.9rem; font-weight:800; color:var(--navy); line-height:1.12; letter-spacing:-.5px;}
  .hero h1 .accent{color:var(--green);}
  .hero p{margin-top:18px; color:var(--muted); font-size:15.5px; max-width:480px;}
  .hero-cta{display:flex; gap:12px; margin-top:26px; flex-wrap:wrap;}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:8px; font-weight:700; font-size:14px; border:none; transition:transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);}
  .btn svg{width:16px; height:16px;}
  .btn:hover{transform:translateY(-2px);}
  .btn-green{background:var(--green); color:#fff;}
  .btn-green:hover{background:var(--green-dark);}
  .btn-navy{background:var(--navy); color:#fff;}
  .btn-navy:hover{background:#1e3a70;}
  .btn-outline{background:#fff; color:var(--navy); border:1px solid var(--line); box-shadow:var(--shadow);}
  .hero-image{position:relative; border-radius:16px; overflow:hidden; box-shadow:var(--shadow); animation:floatY 7s ease-in-out infinite;}
  .hero-image img{width:100%; height:100%; object-fit:cover; aspect-ratio:4/3;}

  /* ---------- Stats ---------- */
  .stats-wrap{padding:0 24px; margin-top:-46px; position:relative; z-index:5;}
  .stats-card{max-width:1180px; margin:0 auto; background:#fff; border-radius:16px; box-shadow:var(--shadow); display:grid; grid-template-columns:repeat(5,1fr); padding:30px 10px;}
  .stat{text-align:center; padding:6px 10px; border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat .icon{width:26px; height:26px; margin:0 auto 10px; color:var(--green);}
  .stat .icon svg{width:100%; height:100%;}
  .stat .label{font-size:13px; color:var(--muted); font-weight:600;}
  .stat .num{font-size:1.8rem; font-weight:800; color:var(--navy); margin-top:4px;}

  /* ---------- Sections ---------- */
  .section{padding:80px 24px;}
  .section-head{text-align:center; max-width:640px; margin:0 auto 42px;}
  .eyebrow{color:var(--green); font-weight:800; font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase;}
  .section-head h2{font-size:2.1rem; color:var(--navy); font-weight:800; margin-top:8px;}

  /* ---------- Pillars ---------- */
  .pillars-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px; max-width:1180px; margin:0 auto;}
  .pillar-card{border:1px solid var(--line); border-radius:12px; padding:26px 22px; text-align:center; border-bottom:4px solid var(--card-color, var(--green)); transition:transform .2s var(--ease), box-shadow .2s var(--ease);}
  .pillar-card:hover{transform:translateY(-4px); box-shadow:var(--shadow);}
  .pillar-icon{width:56px;height:56px;border-radius:50%; background:var(--card-color, var(--green)); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
  .pillar-icon svg{width:24px; height:24px;}
  .pillar-card h3{font-size:16px; color:var(--navy); font-weight:800; margin-bottom:8px;}
  .pillar-card p{font-size:13.5px; color:var(--muted);}

  /* ---------- About + Flagship ---------- */
  .split-section{background:#f6f8f4;}
  .split-grid{display:grid; grid-template-columns:1fr 1fr; gap:28px; max-width:1180px; margin:0 auto;}
  .split-panel{background:#fff; border-radius:16px; overflow:hidden; box-shadow:var(--shadow); display:grid; grid-template-columns:0.85fr 1.15fr;}
  .split-panel.flagship{background:transparent; box-shadow:none;}
  .panel-img{height:100%; min-height:280px;}
  .panel-img img{width:100%; height:100%; object-fit:cover;}
  .panel-body{padding:32px 30px;}
  .panel-body .eyebrow{display:block; margin-bottom:6px;}
  .panel-body h2{font-size:1.7rem; color:var(--navy); font-weight:800; margin-bottom:14px;}
  .panel-body p{color:var(--muted); font-size:14.5px; margin-bottom:16px;}
  .signee-row{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .signee-mark{width:38px; height:38px; border-radius:50%; background:var(--cream); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--green); font-size:13px; flex-shrink:0;}
  .signee-name{font-weight:800; color:var(--navy); font-size:14px;}
  .signee-role{font-size:12.5px; color:var(--muted);}
  .check-list{margin:16px 0; display:flex; flex-direction:column; gap:9px;}
  .check-list li{display:flex; align-items:center; gap:10px; font-size:14px; color:#333;}
  .check-list .tick{width:18px;height:18px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .check-list .tick svg{width:10px; height:10px;}
  .flagship-inner{display:grid; grid-template-columns:1fr 0.9fr; gap:28px; align-items:center;}
  .flagship-img{border-radius:16px; overflow:hidden; box-shadow:var(--shadow); height:100%;}
  .flagship-img img{width:100%; height:100%; object-fit:cover; aspect-ratio:4/5;}

  /* ---------- CTA band ---------- */
  .cta-band{background:var(--navy); color:#fff;}
  .cta-grid{display:grid; grid-template-columns:1.3fr repeat(3,1fr); max-width:1180px; margin:0 auto; align-items:center;}
  .cta-lead{display:flex; align-items:center; gap:18px; padding:34px 24px 34px 0;}
  .cta-lead .circle{width:58px;height:58px;border-radius:50%; background:#fff; color:var(--navy); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .cta-lead .circle svg{width:26px; height:26px;}
  .cta-lead h3{font-size:17px; font-weight:800;}
  .cta-lead p{font-size:13px; color:#c7cfe0; margin-top:4px;}
  .cta-item{display:flex; gap:14px; align-items:flex-start; padding:34px 24px; border-left:1px solid rgba(255,255,255,.14);}
  .cta-item .circle{width:44px;height:44px;border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .cta-item .circle svg{width:19px; height:19px; color:#fff;}
  .cta-item h4{font-size:15px; font-weight:800; margin-bottom:4px;}
  .cta-item p{font-size:12.5px; color:#c7cfe0;}

  /* ---------- Footer ---------- */
  footer{background:var(--green-dark); color:#dfeee4; padding:56px 24px 0;}
  .footer-grid{display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr 1.2fr; gap:24px; max-width:1180px; margin:0 auto; padding-bottom:40px;}
  .footer-brand .brand{margin-bottom:14px;}
  .footer-brand .name{color:#fff;}
  .footer-brand .tag{color:#a9c9b3;}
  .footer-brand p{font-size:13px; color:#bcd6c3; margin:14px 0 16px; max-width:230px;}
  .footer-social{display:flex; gap:10px;}
  .footer-social a{width:32px;height:32px;border-radius:50%; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; transition:background .2s var(--ease);}
  .footer-social a:hover{background:rgba(255,255,255,.24);}
  .footer-social svg{width:14px; height:14px;}
  .footer-col h5{font-size:13px; letter-spacing:1px; text-transform:uppercase; color:#fff; margin-bottom:16px; font-weight:800;}
  .footer-col ul{display:flex; flex-direction:column; gap:10px;}
  .footer-col a{font-size:13.5px; color:#bcd6c3; transition:color .2s var(--ease);}
  .footer-col a:hover{color:#fff;}
  .footer-contact li{display:flex; gap:10px; font-size:13.5px; color:#bcd6c3; margin-bottom:14px; align-items:flex-start;}
  .footer-contact svg{width:15px; height:15px; flex-shrink:0; margin-top:2px;}
  .footer-bottom{border-top:1px solid rgba(255,255,255,.14); padding:18px 24px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; font-size:12.5px; color:#a9c9b3; max-width:1180px; margin:0 auto;}
  .footer-bottom .links{display:flex; gap:18px;}
  .footer-bottom a:hover{color:#fff;}

  /* ---------- Responsive ---------- */
  @media (max-width: 980px){
    nav.primary{position:fixed; top:0; right:0; height:100vh; width:min(320px,84vw); background:#fff; flex-direction:column; align-items:flex-start; padding:88px 28px 28px; box-shadow:-16px 0 40px -20px rgba(0,0,0,.25); transform:translateX(100%); transition:transform .35s var(--ease); z-index:200; gap:0;}
    nav.primary.open{transform:translateX(0);}
    nav.primary ul{flex-direction:column; align-items:flex-start; gap:20px; width:100%;}
    nav.primary li{opacity:0; transform:translateX(18px); transition:opacity .35s var(--ease), transform .35s var(--ease); transition-delay:0s;}
    nav.primary.open li{opacity:1; transform:translateX(0);}
    nav.primary.open li:nth-child(1){transition-delay:.06s;}
    nav.primary.open li:nth-child(2){transition-delay:.10s;}
    nav.primary.open li:nth-child(3){transition-delay:.14s;}
    nav.primary.open li:nth-child(4){transition-delay:.18s;}
    nav.primary.open li:nth-child(5){transition-delay:.22s;}
    nav.primary.open li:nth-child(6){transition-delay:.26s;}
    nav.primary.open li:nth-child(7){transition-delay:.30s;}
    nav.primary .donate-btn{opacity:0; transform:translateY(10px); transition:opacity .35s var(--ease) .34s, transform .35s var(--ease) .34s;}
    nav.primary.open .donate-btn{opacity:1; transform:translateY(0);}
    nav.primary a.navlink.active::after{display:none;}
    nav.primary .donate-btn{margin-top:26px; width:100%; justify-content:center;}
    .menu-toggle{display:block;}
    .hero-grid{grid-template-columns:1fr; padding-top:34px;}
    .hero h1{font-size:2.2rem;}
    .stats-card{grid-template-columns:repeat(3,1fr); gap:22px 0;}
    .stat{border-right:none; border-bottom:1px solid var(--line); padding-bottom:18px;}
    .stats-wrap{margin-top:-24px;}
    .pillars-grid{grid-template-columns:repeat(2,1fr);}
    .split-panel{grid-template-columns:1fr;}
    .panel-img{min-height:200px;}
    .split-grid{grid-template-columns:1fr;}
    .flagship-inner{grid-template-columns:1fr;}
    .flagship-img img{aspect-ratio:16/9;}
    .cta-grid{grid-template-columns:1fr;}
    .cta-lead{padding:28px 0;}
    .cta-item{border-left:none; border-top:1px solid rgba(255,255,255,.14); padding:24px 0;}
    .footer-grid{grid-template-columns:1fr 1fr;}
  }
  @media (max-width: 600px){
    .topbar-left span:not(:first-child){display:none;}
    .hero h1{font-size:1.9rem;}
    .pillars-grid{grid-template-columns:1fr;}
    .stats-card{grid-template-columns:repeat(2,1fr);}
    .footer-grid{grid-template-columns:1fr;}
    .footer-bottom{flex-direction:column; text-align:center;}
  }
</style>
</head>
<body>

<div class="scroll-progress" id="scrollProgress"></div>

<div class="topbar">
  <div class="wrap">
    <div class="topbar-left" id="topbarLeft"></div>
    <div class="topbar-social" id="topbarSocial"></div>
  </div>
</div>

<header class="main">
  <div class="wrap nav-row">
    <div class="brand">
      <div class="brand-mark">OCF</div>
      <div class="brand-text">
        <div class="name">OMHENAKA <span class="accent">CARE FOUNDATION</span></div>
        <div class="tag" id="brandTag"></div>
      </div>
    </div>
    <nav class="primary" id="primaryNav">
      <ul id="navList"></ul>
      <button class="donate-btn" id="donateBtn"></button>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu"></button>
  </div>
</header>
<div class="nav-overlay" id="navOverlay"></div>

<section class="hero">
  <div class="wrap hero-grid">
    <div class="hero-copy reveal-left" id="heroCopy">
      <h1 id="heroHeadline"></h1>
      <p id="heroBody"></p>
      <div class="hero-cta" id="heroCta"></div>
    </div>
    <div class="hero-image reveal-right" id="heroImageWrap">
      <img id="heroImage" src="" alt="Volunteers cleaning up the community">
    </div>
  </div>
</section>

<div class="stats-wrap">
  <div class="stats-card reveal-scale" id="statsCard"></div>
</div>

<section class="section" id="pillarsSection">
  <div class="section-head reveal">
    <div class="eyebrow" id="pillarsEyebrow"></div>
    <h2 id="pillarsHeading"></h2>
  </div>
  <div class="pillars-grid" id="pillarsGrid"></div>
</section>

<section class="section split-section">
  <div class="split-grid">
    <div class="split-panel about-panel reveal-left" id="aboutPanel"></div>
    <div class="split-panel flagship reveal-right" id="flagshipPanel"></div>
  </div>
</section>

<section class="cta-band">
  <div class="cta-grid" id="ctaGrid"></div>
</section>

<footer>
  <div class="footer-grid" id="footerGrid"></div>
  <div class="footer-bottom" id="footerBottom"></div>
</footer>

<script>
/* ============ ICONS (stroke-based, currentColor) ============ */
const ICON = {
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
  caret: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>',

/* ============ RENDER HELPERS ============ */
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else node.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}
const icoSpan = (svg) => el("span", { html: svg });

    if (item.caret) a.insertAdjacentHTML("beforeend", ICON.caret);

  const donateBtn = document.getElementById("donateBtn");

  function closeMenu(){ nav.classList.remove("open"); overlay.classList.remove("open"); toggle.innerHTML = ICON.menu; }
  function openMenu(){ nav.classList.add("open"); overlay.classList.add("open"); toggle.innerHTML = ICON.close; }
  toggle.addEventListener("click", () => nav.classList.contains("open") ? closeMenu() : openMenu());
  overlay.addEventListener("click", closeMenu);

}

/* ---- Stats ---- */
function renderStats() {
  const card = document.getElementById("statsCard");
  DATA.stats.forEach(s => {
    const numMatch = s.value.match(/[\d.]+/);
    const target = numMatch ? parseFloat(numMatch[0]) : null;
    const suffix = numMatch ? s.value.replace(numMatch[0], "") : "";
    const numEl = el("div", { class: "num", "data-target": target ?? "", "data-suffix": suffix }, target !== null ? "0" + suffix : s.value);
    card.appendChild(el("div", { class: "stat" }, [
      el("div", { class: "icon", html: s.icon }),
      el("div", { class: "label" }, s.label),
      numEl
    ]));
  });
}

function animateCount(el) {
  const target = parseFloat(el.dataset.target);
  const suffix = el.dataset.suffix || "";
  if (isNaN(target)) return;
  const duration = 1100;
  const start = performance.now();
  function tick(now) {
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    const val = Math.round(target * eased);
    el.textContent = val + suffix;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---- Scroll reveal ---- */
function initReveal() {
  const items = document.querySelectorAll(".reveal, .reveal-left, .reveal-right, .reveal-scale");
  if (!("IntersectionObserver" in window)) {
    items.forEach(i => { i.classList.add("in"); if (i.id === "statsCard") kickOffCounts(); });
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add("in");
        if (e.target.id === "statsCard") kickOffCounts();
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });
  items.forEach(i => io.observe(i));
}

function kickOffCounts() {
  document.querySelectorAll("#statsCard .num[data-target]").forEach((el, i) => {
    setTimeout(() => animateCount(el), i * 90);
  });
}

/* ---- Hero: animate in on load, not on scroll ---- */
function initHeroEntrance() {
  requestAnimationFrame(() => {
    setTimeout(() => document.getElementById("heroCopy").classList.add("in"), 80);
    setTimeout(() => document.getElementById("heroImageWrap").classList.add("in"), 220);
  });
}

/* ---- Scroll progress bar + header shadow ---- */
function initScrollFx() {
  const bar = document.getElementById("scrollProgress");
  const header = document.querySelector("header.main");
  function onScroll() {
    const h = document.documentElement;
    const scrolled = h.scrollTop;
    const max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (scrolled / max) * 100 : 0) + "%";
    header.classList.toggle("scrolled", scrolled > 8);
  }
  document.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
}
