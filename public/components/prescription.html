<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiloh Clinic & Maternity — Prescriptions</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --navy:#0b1a4d; --blue-accent:#2f6fed; --bg:#f4f6fb; --card:#ffffff; --border:#eef0f6;
    --text-dark:#1c2440; --text-mid:#6b7280; --text-light:#9aa1b3;
    --green:#12b76a; --green-bg:#e9f9f0;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    --orange:#f79009; --orange-bg:#fff4e5;
    --red:#f04438; --red-bg:#feecec;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    background:var(--bg); color:var(--text-dark); font-size:13px; padding:26px;
    display:flex; justify-content:center;
  }

  .page-wrap{width:100%; max-width:1100px;}

  .back-btn{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:10px;
    padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--text-dark);white-space:nowrap;cursor:pointer;
    margin-bottom:16px;max-width:fit-content;
  }
  .back-btn:hover{background:var(--bg);}
  .back-btn i{color:var(--text-mid);font-size:11px;}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;}

  .rx-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .rx-title{font-size:15px;font-weight:800;color:var(--text-dark);}
  .rx-sub{font-size:11.5px;color:var(--text-light);font-weight:600;margin-top:2px;}
  .btn-primary{
    display:flex;align-items:center;gap:8px;background:var(--blue-accent);border:1px solid var(--blue-accent);
    border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;cursor:pointer;
    box-shadow:0 4px 10px rgba(47,111,237,0.28);
  }
  .btn-primary:hover{background:#2660d6;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
  .btn-secondary{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);
    border-radius:10px;padding:9px 14px;font-size:12px;font-weight:700;color:var(--text-mid);white-space:nowrap;cursor:pointer;
  }
  .btn-secondary:hover{background:var(--bg);color:var(--text-dark);}

  /* stat chips */
  .rx-stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .rx-stat{flex:1;min-width:130px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;}
  .rx-stat-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .rx-stat-label{font-size:10.5px;color:var(--text-mid);font-weight:700;}
  .rx-stat-value{font-size:16px;font-weight:800;color:var(--text-dark);}

  /* filters */
  .rx-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .rx-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 12px;flex:1;min-width:200px;}
  .rx-search i{color:var(--text-light);font-size:12px;}
  .rx-search input{border:none;background:transparent;outline:none;font-size:12.5px;color:var(--text-dark);width:100%;font-family:inherit;}
  .rx-search input::placeholder{color:var(--text-light);}
  .rx-select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--text-dark);cursor:pointer;font-family:inherit;}

  /* expandable prescription rows */
  .rx-item{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .rx-item:last-child{margin-bottom:0;}
  .rx-item-head{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;}
  .rx-item-ic{width:36px;height:36px;border-radius:9px;background:var(--purple-bg);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .rx-item-body{flex:1;min-width:0;}
  .rx-item-name{font-size:12.5px;font-weight:800;color:var(--text-dark);}
  .rx-item-meta{font-size:11px;color:var(--text-light);font-weight:600;margin-top:1px;}
  .rx-item-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .rx-flag{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .rx-flag-dispensed{background:var(--green-bg);color:#0a8a52;}
  .rx-flag-pending{background:var(--orange-bg);color:#c56c05;}
  .rx-flag-active{background:var(--blue-bg);color:#1d54c9;}
  .rx-chevron{color:var(--text-light);font-size:11px;transition:transform .2s;}
  .rx-item.open .rx-chevron{transform:rotate(180deg);}

  .rx-item-detail{display:none;border-top:1px solid var(--border);padding:14px;}
  .rx-item.open .rx-item-detail{display:block;}

  table.rx-table{width:100%;border-collapse:collapse;}
  table.rx-table thead th{text-align:left;font-size:10.5px;letter-spacing:.03em;color:var(--text-light);text-transform:uppercase;font-weight:700;padding:7px 6px;border-bottom:1px solid var(--border);}
  table.rx-table tbody td{padding:9px 6px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-dark);font-weight:600;}
  table.rx-table tbody tr:last-child td{border-bottom:none;}

  .rx-detail-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .rx-detail-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:#fff;border-radius:9px;padding:8px 13px;font-size:11.5px;font-weight:700;color:var(--text-dark);cursor:pointer;}
  .rx-detail-btn:hover{border-color:var(--blue-bg);color:var(--blue);}
  .rx-detail-btn.refill{border-color:var(--blue-bg);background:var(--blue-bg);color:var(--blue);}
  .rx-detail-btn:disabled{opacity:.5;cursor:not-allowed;}

  .rx-notes{background:var(--bg);border-radius:9px;padding:10px 12px;font-size:11.5px;color:var(--text-mid);font-weight:600;margin-top:10px;line-height:1.5;}
  .rx-notes b{color:var(--text-dark);}

  .empty-state{padding:40px 10px;text-align:center;color:var(--text-light);}
  .empty-state i{font-size:26px;margin-bottom:10px;display:block;color:var(--text-light);}
  .empty-state div{font-size:12.5px;font-weight:600;}

  /* modal shared */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,20,40,0.45);display:none;align-items:center;justify-content:center;
    z-index:200;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(10,15,40,0.25);max-height:90vh;overflow-y:auto;}
  .modal-box.wide{max-width:620px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-title{font-size:15px;font-weight:800;color:var(--text-dark);}
  .modal-close{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-mid);cursor:pointer;font-size:13px;flex-shrink:0;}
  .modal-close:hover{background:var(--bg);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  /* new prescription form */
  .form-group{margin-bottom:14px;}
  .form-label{font-size:11px;font-weight:800;color:var(--text-mid);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;display:block;}
  .form-input, .form-select{
    width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:inherit;
    font-size:12.5px;color:var(--text-dark);outline:none;background:#fff;
  }
  .form-input:focus, .form-select:focus{border-color:var(--blue-accent);}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .med-row{display:grid;grid-template-columns:1.6fr 1fr 1.2fr 0.9fr auto;gap:8px;margin-bottom:8px;align-items:center;}
  .med-row input{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit;outline:none;}
  .med-row input:focus{border-color:var(--blue-accent);}
  .med-remove{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .med-remove:hover{background:var(--red-bg);}
  .add-med-btn{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--blue-accent);cursor:pointer;margin-top:4px;}
  .add-med-btn:hover{text-decoration:underline;}

  /* full prescription preview */
  .rx-doc{border:1px solid var(--border);border-radius:12px;padding:20px;}
  .rx-doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:14px;}
  .rx-doc-clinic{font-size:15px;font-weight:800;color:var(--navy);}
  .rx-doc-clinic-sub{font-size:10.5px;color:var(--text-light);font-weight:600;margin-top:2px;}
  .rx-doc-no{text-align:right;font-size:11px;color:var(--text-mid);font-weight:700;}
  .rx-doc-no b{color:var(--text-dark);font-size:13px;}
  .rx-doc-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .rx-doc-meta-item{font-size:11.5px;}
  .rx-doc-meta-item span{display:block;font-size:9.5px;color:var(--text-light);text-transform:uppercase;font-weight:800;letter-spacing:.03em;margin-bottom:2px;}
  .rx-doc-sign{margin-top:22px;display:flex;justify-content:space-between;align-items:flex-end;}
  .rx-doc-sign-line{border-top:1px solid var(--text-light);padding-top:6px;font-size:11px;font-weight:700;color:var(--text-mid);min-width:180px;text-align:center;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
    padding:11px 20px;border-radius:10px;font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(10,15,40,0.3);
    opacity:0;pointer-events:none;transition:.22s; z-index:300; display:flex; align-items:center; gap:9px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast i{color:var(--green);}

  /* print handling */
  #printArea{display:none;}
  body.print-mode > *:not(#printArea){display:none !important;}
  body.print-mode #printArea{display:block !important; padding:30px;}

  @media (max-width:720px){
    body{padding:14px;}
    .rx-stats{flex-direction:column;}
    .rx-item-meta{display:none;}
    .form-row, .rx-doc-meta{grid-template-columns:1fr;}
    .med-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="page-wrap">

  <div class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Back to Profile</div>

  <div class="panel">

    <div class="rx-head">
      <div>
        <div class="rx-title">Prescriptions</div>
        <div class="rx-sub">Medications prescribed to this patient</div>
      </div>
      <div class="btn-primary" id="newRxBtn"><i class="fa-solid fa-prescription"></i> New Prescription</div>
    </div>

    <!-- stat chips -->
    <div class="rx-stats" id="statsRow"></div>

    <!-- filters -->
    <div class="rx-filters">
      <div class="rx-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="searchInput" placeholder="Search medication or prescription no…"></div>
      <select class="rx-select" id="statusFilter">
        <option value="all">All Statuses</option>
        <option value="dispensed">Dispensed</option>
        <option value="pending">Pending Pickup</option>
        <option value="active">Active</option>
      </select>
      <select class="rx-select" id="doctorFilter">
        <option value="all">All Doctors</option>
      </select>
    </div>

    <!-- expandable prescription list -->
    <div id="rxList"></div>

    <div class="empty-state" id="emptyState" style="display:none;">
      <i class="fa-solid fa-prescription-bottle"></i>
      <div>No prescriptions match your filters</div>
    </div>

  </div>

</div>

<!-- new prescription modal -->
<div class="modal-overlay" id="newRxModal">
  <div class="modal-box wide">
    <div class="modal-head">
      <div class="modal-title">New prescription</div>
      <div class="modal-close" id="newRxClose"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Prescribing doctor</label>
        <select class="form-select" id="fDoctor">
          <option>Dr. Samuel O.</option>
          <option>Dr. Amaka N.</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="fStatus">
          <option value="pending">Pending Pickup</option>
          <option value="active">Active — Refillable</option>
          <option value="dispensed">Dispensed</option>
        </select>
      </div>
    </div>

    <label class="form-label">Medications</label>
    <div id="medRowsHead" class="med-row" style="margin-bottom:4px;">
      <span style="font-size:9.5px;color:var(--text-light);font-weight:800;text-transform:uppercase;">Medication</span>
      <span style="font-size:9.5px;color:var(--text-light);font-weight:800;text-transform:uppercase;">Dosage</span>
      <span style="font-size:9.5px;color:var(--text-light);font-weight:800;text-transform:uppercase;">Frequency</span>
      <span style="font-size:9.5px;color:var(--text-light);font-weight:800;text-transform:uppercase;">Duration</span>
      <span></span>
    </div>
    <div id="medRows"></div>
    <div class="add-med-btn" id="addMedBtn"><i class="fa-solid fa-plus"></i> Add another medication</div>

    <div class="form-group" style="margin-top:14px;">
      <label class="form-label">Notes (optional)</label>
      <input class="form-input" id="fNotes" placeholder="Instructions for patient or pharmacy…">
    </div>

    <div class="modal-actions">
      <div class="btn-secondary" id="newRxCancel">Cancel</div>
      <div class="btn-primary" id="newRxSubmit"><i class="fa-solid fa-check"></i> Save Prescription</div>
    </div>
  </div>
</div>

<!-- full prescription view modal -->
<div class="modal-overlay" id="viewRxModal">
  <div class="modal-box wide">
    <div class="modal-head">
      <div class="modal-title">Full Prescription</div>
      <div class="modal-close" id="viewRxClose"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div class="rx-doc" id="rxDocPreview"></div>
    <div class="modal-actions">
      <div class="btn-secondary" id="viewRxPrint"><i class="fa-solid fa-print"></i> Print</div>
    </div>
  </div>
</div>

<!-- hidden printable area -->
<div id="printArea"></div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toastText">Saved</span></div>

<script>
(function(){
  const STATUS_META = {
    dispensed: { label:'Dispensed', cls:'rx-flag-dispensed' },
    pending: { label:'Pending Pickup', cls:'rx-flag-pending' },
    active: { label:'Active — Refillable', cls:'rx-flag-active' }
  };

  const el = id => document.getElementById(id);

  let prescriptions = [
    {
      id:1, rxNo:'RX-000067', doctor:'Dr. Samuel O.', date:'May 16, 2025', status:'dispensed', open:true,
      meds:[
        {name:'Amlodipine 5mg', dosage:'1 tablet', freq:'Once daily', duration:'30 days'},
        {name:'Paracetamol 500mg', dosage:'2 tablets', freq:'Every 6 hrs as needed', duration:'5 days'}
      ],
      notes:'Take Amlodipine in the morning. Monitor blood pressure weekly.'
    },
    {
      id:2, rxNo:'RX-000055', doctor:'Dr. Samuel O.', date:'May 9, 2025', status:'dispensed', open:false,
      meds:[{name:'Amoxicillin 500mg', dosage:'1 capsule', freq:'3x daily', duration:'7 days'}],
      notes:''
    },
    {
      id:3, rxNo:'RX-000071', doctor:'Dr. Amaka N.', date:'May 17, 2025', status:'pending', open:false,
      meds:[
        {name:'Folic Acid 5mg', dosage:'1 tablet', freq:'Once daily', duration:'90 days'},
        {name:'Ferrous Sulphate 200mg', dosage:'1 tablet', freq:'Once daily', duration:'90 days'}
      ],
      notes:''
    },
    {
      id:4, rxNo:'RX-000043', doctor:'Dr. Samuel O.', date:'Apr 28, 2025', status:'active', open:false,
      meds:[{name:'Amlodipine 5mg', dosage:'1 tablet', freq:'Once daily', duration:'Ongoing'}],
      notes:''
    }
  ];
  let nextId = 5;
  let nextNum = 72;

  let state = { search:'', status:'all', doctor:'all' };
  let medRowCount = 0;

  function showToast(msg){
    el('toastText').textContent = msg;
    const t = el('toast');
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function populateDoctorFilter(){
    const doctors = [...new Set(prescriptions.map(p=>p.doctor))].sort();
    const sel = el('doctorFilter');
    const current = sel.value;
    sel.innerHTML = '<option value="all">All Doctors</option>' +
      doctors.map(d=>`<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
    sel.value = doctors.includes(current) ? current : 'all';
  }

  function getFiltered(){
    const q = state.search.trim().toLowerCase();
    return prescriptions.filter(p=>{
      if(state.status !== 'all' && p.status !== state.status) return false;
      if(state.doctor !== 'all' && p.doctor !== state.doctor) return false;
      if(q){
        const inNo = p.rxNo.toLowerCase().includes(q);
        const inMed = p.meds.some(m=>m.name.toLowerCase().includes(q));
        if(!inNo && !inMed) return false;
      }
      return true;
    });
  }

  function renderStats(){
    const total = prescriptions.length;
    const dispensed = prescriptions.filter(p=>p.status==='dispensed').length;
    const pending = prescriptions.filter(p=>p.status==='pending').length;
    const active = prescriptions.filter(p=>p.status==='active').length;
    el('statsRow').innerHTML = `
      <div class="rx-stat"><div class="rx-stat-ic" style="background:var(--purple-bg);color:var(--purple);"><i class="fa-solid fa-prescription"></i></div><div><div class="rx-stat-label">Total Prescriptions</div><div class="rx-stat-value">${total}</div></div></div>
      <div class="rx-stat"><div class="rx-stat-ic" style="background:var(--green-bg);color:var(--green);"><i class="fa-solid fa-circle-check"></i></div><div><div class="rx-stat-label">Dispensed</div><div class="rx-stat-value">${dispensed}</div></div></div>
      <div class="rx-stat"><div class="rx-stat-ic" style="background:var(--orange-bg);color:var(--orange);"><i class="fa-solid fa-hourglass-half"></i></div><div><div class="rx-stat-label">Pending Pickup</div><div class="rx-stat-value">${pending}</div></div></div>
      <div class="rx-stat"><div class="rx-stat-ic" style="background:var(--blue-bg);color:var(--blue);"><i class="fa-solid fa-rotate"></i></div><div><div class="rx-stat-label">Active / Refillable</div><div class="rx-stat-value">${active}</div></div></div>
    `;
  }

  function renderItem(p){
    const meta = STATUS_META[p.status];
    const medsRows = p.meds.map(m=>`
      <tr><td>${escapeHtml(m.name)}</td><td>${escapeHtml(m.dosage)}</td><td>${escapeHtml(m.freq)}</td><td>${escapeHtml(m.duration)}</td></tr>
    `).join('');
    let actionBtns = `<div class="rx-detail-btn" data-action="view" data-id="${p.id}"><i class="fa-regular fa-file-pdf"></i> View Full Prescription</div>`;
    if(p.status === 'pending'){
      actionBtns = `<div class="rx-detail-btn refill" data-action="dispense" data-id="${p.id}"><i class="fa-solid fa-basket-shopping"></i> Ready for Pharmacy Pickup</div>` + actionBtns;
    } else if(p.status === 'active'){
      actionBtns = `<div class="rx-detail-btn refill" data-action="refill" data-id="${p.id}"><i class="fa-solid fa-rotate"></i> Request Refill</div>` + actionBtns;
    }
    actionBtns += `<div class="rx-detail-btn" data-action="print" data-id="${p.id}"><i class="fa-solid fa-print"></i> Print</div>`;

    return `
      <div class="rx-item ${p.open?'open':''}" data-id="${p.id}">
        <div class="rx-item-head" data-toggle="${p.id}">
          <div class="rx-item-ic"><i class="fa-solid fa-pills"></i></div>
          <div class="rx-item-body">
            <div class="rx-item-name">${p.rxNo}</div>
            <div class="rx-item-meta">Prescribed by ${escapeHtml(p.doctor)} · ${p.date}</div>
          </div>
          <div class="rx-item-right">
            <span class="rx-flag ${meta.cls}">${meta.label}</span>
            <i class="fa-solid fa-chevron-down rx-chevron"></i>
          </div>
        </div>
        <div class="rx-item-detail">
          <table class="rx-table">
            <thead><tr><th>Medication</th><th>Dosage</th><th>Frequency</th><th>Duration</th></tr></thead>
            <tbody>${medsRows}</tbody>
          </table>
          ${p.notes ? `<div class="rx-notes"><b>Notes:</b> ${escapeHtml(p.notes)}</div>` : ''}
          <div class="rx-detail-actions">${actionBtns}</div>
        </div>
      </div>`;
  }

  function render(){
    renderStats();
    populateDoctorFilter();
    const filtered = getFiltered();
    el('rxList').innerHTML = filtered.map(renderItem).join('');
    el('emptyState').style.display = filtered.length ? 'none' : 'block';
    attachListeners();
  }

  function attachListeners(){
    document.querySelectorAll('[data-toggle]').forEach(head=>{
      head.addEventListener('click', ()=>{
        const id = Number(head.dataset.toggle);
        const p = prescriptions.find(x=>x.id===id);
        p.open = !p.open;
        render();
      });
    });
    document.querySelectorAll('[data-action="view"]').forEach(b=>{
      b.addEventListener('click', e=>{ e.stopPropagation(); openViewRxModal(Number(b.dataset.id)); });
    });
    document.querySelectorAll('[data-action="print"]').forEach(b=>{
      b.addEventListener('click', e=>{ e.stopPropagation(); printPrescription(Number(b.dataset.id)); });
    });
    document.querySelectorAll('[data-action="dispense"]').forEach(b=>{
      b.addEventListener('click', e=>{
        e.stopPropagation();
        const p = prescriptions.find(x=>x.id===Number(b.dataset.id));
        p.status = 'dispensed';
        showToast(`${p.rxNo} marked as dispensed`);
        render();
      });
    });
    document.querySelectorAll('[data-action="refill"]').forEach(b=>{
      b.addEventListener('click', e=>{
        e.stopPropagation();
        const p = prescriptions.find(x=>x.id===Number(b.dataset.id));
        p.status = 'pending';
        showToast(`Refill requested for ${p.rxNo} — sent to pharmacy`);
        render();
      });
    });
  }

  // ---- filters ----
  el('searchInput').addEventListener('input', e=>{ state.search = e.target.value; render(); });
  el('statusFilter').addEventListener('change', e=>{ state.status = e.target.value; render(); });
  el('doctorFilter').addEventListener('change', e=>{ state.doctor = e.target.value; render(); });

  // ---- new prescription modal ----
  function medRowHtml(idx){
    return `
      <div class="med-row" data-med-row="${idx}">
        <input type="text" placeholder="e.g. Amlodipine 5mg" data-field="name">
        <input type="text" placeholder="e.g. 1 tablet" data-field="dosage">
        <input type="text" placeholder="e.g. Once daily" data-field="freq">
        <input type="text" placeholder="e.g. 30 days" data-field="duration">
        <div class="med-remove" data-remove="${idx}"><i class="fa-solid fa-trash"></i></div>
      </div>`;
  }
  function addMedRow(){
    medRowCount++;
    el('medRows').insertAdjacentHTML('beforeend', medRowHtml(medRowCount));
    el('medRows').querySelector(`[data-remove="${medRowCount}"]`).addEventListener('click', ()=>{
      const row = el('medRows').querySelector(`[data-med-row="${medRowCount}"]`);
      if(el('medRows').children.length > 1) row.remove();
      else showToast('At least one medication is required');
    });
  }
  function openNewRxModal(){
    el('fDoctor').value = 'Dr. Samuel O.';
    el('fStatus').value = 'pending';
    el('fNotes').value = '';
    el('medRows').innerHTML = '';
    medRowCount = 0;
    addMedRow();
    el('newRxModal').classList.add('open');
  }
  function closeNewRxModal(){ el('newRxModal').classList.remove('open'); }
  el('newRxBtn').addEventListener('click', openNewRxModal);
  el('newRxClose').addEventListener('click', closeNewRxModal);
  el('newRxCancel').addEventListener('click', closeNewRxModal);
  el('newRxModal').addEventListener('click', e=>{ if(e.target.id==='newRxModal') closeNewRxModal(); });
  el('addMedBtn').addEventListener('click', addMedRow);

  el('newRxSubmit').addEventListener('click', ()=>{
    const rows = [...el('medRows').querySelectorAll('[data-med-row]')];
    const meds = rows.map(r=>({
      name: r.querySelector('[data-field="name"]').value.trim(),
      dosage: r.querySelector('[data-field="dosage"]').value.trim(),
      freq: r.querySelector('[data-field="freq"]').value.trim(),
      duration: r.querySelector('[data-field="duration"]').value.trim()
    })).filter(m=>m.name);

    if(meds.length === 0){
      showToast('Add at least one medication with a name');
      return;
    }

    const now = new Date();
    nextNum++;
    prescriptions.unshift({
      id: nextId++,
      rxNo: 'RX-' + String(nextNum).padStart(6,'0'),
      doctor: el('fDoctor').value,
      date: now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
      status: el('fStatus').value,
      open: true,
      meds,
      notes: el('fNotes').value.trim()
    });
    closeNewRxModal();
    showToast('Prescription saved');
    render();
  });

  // ---- full prescription preview modal ----
  function docHtml(p){
    const meta = STATUS_META[p.status];
    const medsRows = p.meds.map(m=>`
      <tr><td>${escapeHtml(m.name)}</td><td>${escapeHtml(m.dosage)}</td><td>${escapeHtml(m.freq)}</td><td>${escapeHtml(m.duration)}</td></tr>
    `).join('');
    return `
      <div class="rx-doc-head">
        <div>
          <div class="rx-doc-clinic">Shiloh Clinic &amp; Maternity</div>
          <div class="rx-doc-clinic-sub">12 Aba Road, Port Harcourt, Rivers State · +234 800 000 0000</div>
        </div>
        <div class="rx-doc-no">Prescription No.<br><b>${p.rxNo}</b></div>
      </div>
      <div class="rx-doc-meta">
        <div class="rx-doc-meta-item"><span>Patient</span>Emeka Johnson</div>
        <div class="rx-doc-meta-item"><span>Date issued</span>${p.date}</div>
        <div class="rx-doc-meta-item"><span>Prescribing doctor</span>${escapeHtml(p.doctor)}</div>
        <div class="rx-doc-meta-item"><span>Status</span><span class="rx-flag ${meta.cls}">${meta.label}</span></div>
      </div>
      <table class="rx-table">
        <thead><tr><th>Medication</th><th>Dosage</th><th>Frequency</th><th>Duration</th></tr></thead>
        <tbody>${medsRows}</tbody>
      </table>
      ${p.notes ? `<div class="rx-notes"><b>Notes:</b> ${escapeHtml(p.notes)}</div>` : ''}
      <div class="rx-doc-sign">
        <div class="rx-doc-sign-line">${escapeHtml(p.doctor)}</div>
        <div class="rx-doc-sign-line">Pharmacist signature</div>
      </div>`;
  }

  let currentViewId = null;
  function openViewRxModal(id){
    const p = prescriptions.find(x=>x.id===id);
    if(!p) return;
    currentViewId = id;
    el('rxDocPreview').innerHTML = docHtml(p);
    el('viewRxModal').classList.add('open');
  }
  function closeViewRxModal(){ el('viewRxModal').classList.remove('open'); }
  el('viewRxClose').addEventListener('click', closeViewRxModal);
  el('viewRxModal').addEventListener('click', e=>{ if(e.target.id==='viewRxModal') closeViewRxModal(); });
  el('viewRxPrint').addEventListener('click', ()=> printPrescription(currentViewId));

  // ---- real print ----
  function printPrescription(id){
    const p = prescriptions.find(x=>x.id===id);
    if(!p) return;
    el('printArea').innerHTML = `<div class="rx-doc" style="border:none;">${docHtml(p)}</div>`;
    document.body.classList.add('print-mode');
    window.print();
  }
  window.addEventListener('afterprint', ()=>{
    document.body.classList.remove('print-mode');
    el('printArea').innerHTML = '';
  });

  el('backBtn').addEventListener('click', ()=> showToast('Back to profile (demo)'));

  render();
})();
</script>

</body>
</html>
