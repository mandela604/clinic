<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiloh Clinic & Maternity — Documents</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --navy:#0b1a4d; --blue-accent:#2f6fed; --bg:#f4f6fb; --card:#ffffff; --border:#eef0f6;
    --text-dark:#1c2440; --text-mid:#6b7280; --text-light:#9aa1b3;
    --green:#12b76a; --green-bg:#e9f9f0;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    --orange:#f79009; --orange-bg:#fff4e5;
    --red:#f04438; --red-bg:#feecec;
    --pink:#ee46bc; --pink-bg:#fdeefa;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    background:var(--bg); color:var(--text-dark); font-size:13px; padding:26px;
    display:flex; justify-content:center;
  }

  .page-wrap{width:100%; max-width:1100px;}

  .back-btn{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:10px;
    padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--text-dark);white-space:nowrap;cursor:pointer;
    margin-bottom:16px;max-width:fit-content;
  }
  .back-btn:hover{background:var(--bg);}
  .back-btn i{color:var(--text-mid);font-size:11px;}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;}

  .dc-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .dc-title{font-size:15px;font-weight:800;color:var(--text-dark);}
  .dc-sub{font-size:11.5px;color:var(--text-light);font-weight:600;margin-top:2px;}
  .btn-primary{
    display:flex;align-items:center;gap:8px;background:var(--blue-accent);border:1px solid var(--blue-accent);
    border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;cursor:pointer;
    box-shadow:0 4px 10px rgba(47,111,237,0.28);
  }
  .btn-primary:hover{background:#2660d6;}
  .btn-secondary{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);
    border-radius:10px;padding:9px 14px;font-size:12px;font-weight:700;color:var(--text-mid);white-space:nowrap;cursor:pointer;
  }
  .btn-secondary:hover{background:var(--bg);color:var(--text-dark);}

  /* category chips */
  .dc-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .dc-cat-chip{
    display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:11.5px;font-weight:700;
    border:1.5px solid var(--border);color:var(--text-mid);cursor:pointer;white-space:nowrap;background:#fff;
  }
  .dc-cat-chip.active{background:var(--blue-accent);border-color:var(--blue-accent);color:#fff;}
  .dc-cat-chip .dc-cat-count{font-size:10px;font-weight:700;opacity:.75;}

  /* filters */
  .dc-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .dc-search{
    display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);
    border-radius:10px;padding:9px 12px;flex:1;min-width:200px;
  }
  .dc-search i{color:var(--text-light);font-size:12px;}
  .dc-search input{border:none;background:transparent;outline:none;font-size:12.5px;color:var(--text-dark);width:100%;font-family:inherit;}
  .dc-search input::placeholder{color:var(--text-light);}
  .dc-select{
    background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 12px;
    font-size:12.5px;font-weight:600;color:var(--text-dark);cursor:pointer;font-family:inherit;
  }
  .dc-viewtoggle{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:3px;}
  .dc-viewtoggle-btn{width:30px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-mid);cursor:pointer;}
  .dc-viewtoggle-btn.active{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.08);}

  /* document grid */
  .dc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .dc-grid.hide{display:none;}
  .dc-card{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:.15s;position:relative;}
  .dc-card:hover{border-color:var(--blue-bg);box-shadow:0 4px 14px rgba(47,111,237,0.08);}
  .dc-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .dc-file-ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .dc-ic-pdf{background:var(--red-bg);color:var(--red);}
  .dc-ic-img{background:var(--blue-bg);color:var(--blue);}
  .dc-ic-doc{background:var(--purple-bg);color:var(--purple);}
  .dc-file-name{font-size:12.5px;font-weight:700;color:var(--text-dark);line-height:1.35;word-break:break-word;}
  .dc-file-meta{font-size:10.5px;color:var(--text-light);font-weight:600;}
  .dc-cat-tag{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-block;width:fit-content;}
  .dc-cat-lab{background:var(--blue-bg);color:#1d54c9;}
  .dc-cat-rx{background:var(--green-bg);color:#0a8a52;}
  .dc-cat-id{background:var(--purple-bg);color:#6b3fd6;}
  .dc-cat-insurance{background:var(--orange-bg);color:#c56c05;}
  .dc-cat-imaging{background:var(--pink-bg);color:#c2299c;}

  /* menu button + dropdown */
  .dc-card-menu{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-light);font-size:12px;flex-shrink:0;cursor:pointer;position:relative;}
  .dc-card-menu:hover{background:var(--bg);color:var(--text-dark);}
  .dc-dropdown{
    position:absolute;top:calc(100% + 4px);right:0;background:#fff;border:1px solid var(--border);
    border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.12);min-width:190px;display:none;z-index:100;padding:4px 0;
  }
  .dc-dropdown.show{display:block;}
  .dc-dropdown-item{
    display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12px;font-weight:600;
    color:var(--text-dark);cursor:pointer;border:none;background:transparent;width:100%;font-family:inherit;text-align:left;
  }
  .dc-dropdown-item:hover{background:var(--bg);}
  .dc-dropdown-item i{width:16px;font-size:12px;color:var(--text-mid);}
  .dc-dropdown-divider{height:1px;background:var(--border);margin:4px 8px;}
  .dc-dropdown-item.danger{color:var(--red);}
  .dc-dropdown-item.danger i{color:var(--red);}

  /* list view */
  .dc-list{display:none;flex-direction:column;}
  .dc-list.show{display:flex;}
  .dc-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);position:relative;}
  .dc-row:last-child{border-bottom:none;}
  .dc-row .dc-file-ic{width:34px;height:34px;font-size:13px;border-radius:8px;}
  .dc-row-name{flex:1;min-width:0;}
  .dc-row-meta{font-size:10.5px;color:var(--text-light);font-weight:600;}
  .dc-row-size{font-size:11.5px;color:var(--text-mid);font-weight:600;width:70px;text-align:right;flex-shrink:0;}
  .dc-row-date{font-size:11.5px;color:var(--text-mid);font-weight:600;width:100px;text-align:right;flex-shrink:0;}

  .empty-state{padding:44px 10px;text-align:center;color:var(--text-light);}
  .empty-state i{font-size:26px;margin-bottom:10px;display:block;color:var(--text-light);}
  .empty-state div{font-size:12.5px;font-weight:600;}

  /* pagination */
  .dc-pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .dc-page-info{font-size:11.5px;color:var(--text-light);font-weight:600;}
  .dc-page-controls{display:flex;align-items:center;gap:6px;}
  .dc-page-btn{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text-mid);
    font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .dc-page-btn:hover:not(:disabled){border-color:var(--blue-accent);color:var(--blue-accent);}
  .dc-page-btn:disabled{opacity:.4;cursor:not-allowed;}
  .dc-page-btn.active{background:var(--blue-accent);border-color:var(--blue-accent);color:#fff;}

  /* modal (shared pattern) */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,20,40,0.45);display:none;align-items:center;justify-content:center;
    z-index:200;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(10,15,40,0.25);max-height:90vh;overflow-y:auto;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-title{font-size:15px;font-weight:800;color:var(--text-dark);}
  .modal-close{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-mid);cursor:pointer;font-size:13px;flex-shrink:0;}
  .modal-close:hover{background:var(--bg);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .form-group{margin-bottom:14px;}
  .form-label{font-size:11px;font-weight:800;color:var(--text-mid);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;display:block;}
  .form-input, .form-select, .form-textarea{
    width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:inherit;
    font-size:12.5px;color:var(--text-dark);outline:none;background:#fff;
  }
  .form-textarea{resize:vertical;min-height:60px;}
  .form-input:focus, .form-select:focus, .form-textarea:focus{border-color:var(--blue-accent);}

  .preview-box{margin-top:6px;padding:22px;background:var(--bg);border-radius:10px;text-align:center;color:var(--text-light);}
  .preview-box i{font-size:42px;display:block;margin-bottom:10px;}
  .preview-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .preview-meta-item{font-size:11.5px;}
  .preview-meta-item span{display:block;font-size:9.5px;color:var(--text-light);text-transform:uppercase;font-weight:800;letter-spacing:.03em;margin-bottom:2px;}
  .preview-desc{font-size:12px;color:var(--text-mid);line-height:1.5;margin-bottom:8px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
    padding:11px 20px;border-radius:10px;font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(10,15,40,0.3);
    opacity:0;pointer-events:none;transition:.22s; z-index:300; display:flex; align-items:center; gap:9px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast i{color:var(--green);}

  @media (max-width:720px){
    body{padding:14px;}
    .dc-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
    .dc-row-date{display:none;}
    .preview-meta-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="page-wrap">

  <div class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Back to Profile</div>

  <div class="panel">

    <div class="dc-head">
      <div>
        <div class="dc-title">Documents</div>
        <div class="dc-sub">Lab reports, prescriptions, imaging &amp; ID files</div>
      </div>
      <div class="btn-primary" id="uploadBtn"><i class="fa-solid fa-upload"></i> Upload Document</div>
    </div>

    <!-- category chips (counts computed live) -->
    <div class="dc-cats" id="catChips"></div>

    <!-- filters -->
    <div class="dc-filters">
      <div class="dc-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search documents…">
      </div>
      <select class="dc-select" id="sortSelect">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="name">Name (A–Z)</option>
        <option value="size">File Size</option>
      </select>
      <div class="dc-viewtoggle">
        <div class="dc-viewtoggle-btn active" data-view="grid"><i class="fa-solid fa-grip"></i></div>
        <div class="dc-viewtoggle-btn" data-view="list"><i class="fa-solid fa-list"></i></div>
      </div>
    </div>

    <!-- grid view -->
    <div class="dc-grid" id="dcGrid"></div>
    <!-- list view -->
    <div class="dc-list" id="dcList"></div>

    <div class="empty-state" id="emptyState" style="display:none;">
      <i class="fa-regular fa-folder-open"></i>
      <div>No documents match your filters</div>
    </div>

    <!-- pagination -->
    <div class="dc-pagination" id="paginationBar">
      <div class="dc-page-info" id="pageInfo"></div>
      <div class="dc-page-controls" id="pageControls"></div>
    </div>

  </div>

</div>

<!-- upload modal -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">Upload a document</div>
      <div class="modal-close" id="uploadClose"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div class="form-group">
      <label class="form-label">File name</label>
      <input class="form-input" id="fName" placeholder="e.g. Ultrasound Scan.jpg">
    </div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <select class="form-select" id="fCategory">
        <option value="lab">Lab Report</option>
        <option value="rx">Prescription</option>
        <option value="imaging">Imaging</option>
        <option value="insurance">Insurance</option>
        <option value="id">ID &amp; Registration</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Description (optional)</label>
      <textarea class="form-textarea" id="fDesc" placeholder="Short note about this file…"></textarea>
    </div>
    <div class="modal-actions">
      <div class="btn-secondary" id="uploadCancel">Cancel</div>
      <div class="btn-primary" id="uploadSubmit"><i class="fa-solid fa-check"></i> Upload</div>
    </div>
  </div>
</div>

<!-- rename modal -->
<div class="modal-overlay" id="renameModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">Rename document</div>
      <div class="modal-close" id="renameClose"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div class="form-group">
      <label class="form-label">File name</label>
      <input class="form-input" id="fRenameValue">
    </div>
    <div class="modal-actions">
      <div class="btn-secondary" id="renameCancel">Cancel</div>
      <div class="btn-primary" id="renameSubmit"><i class="fa-solid fa-check"></i> Save</div>
    </div>
  </div>
</div>

<!-- move modal -->
<div class="modal-overlay" id="moveModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">Move document</div>
      <div class="modal-close" id="moveClose"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div class="form-group">
      <label class="form-label">Move to category</label>
      <select class="form-select" id="fMoveCategory">
        <option value="lab">Lab Report</option>
        <option value="rx">Prescription</option>
        <option value="imaging">Imaging</option>
        <option value="insurance">Insurance</option>
        <option value="id">ID &amp; Registration</option>
      </select>
    </div>
    <div class="modal-actions">
      <div class="btn-secondary" id="moveCancel">Cancel</div>
      <div class="btn-primary" id="moveSubmit"><i class="fa-solid fa-check"></i> Move</div>
    </div>
  </div>
</div>

<!-- preview modal -->
<div class="modal-overlay" id="previewModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="previewTitle">Document Preview</div>
      <div class="modal-close" id="previewClose"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div class="preview-meta-grid" id="previewMeta"></div>
    <div class="preview-desc" id="previewDesc"></div>
    <div class="preview-box" id="previewBox"></div>
    <div class="modal-actions">
      <div class="btn-secondary" id="previewDownloadBtn"><i class="fa-solid fa-download"></i> Download</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toastText">Saved</span></div>

<script>
(function(){
  const CATEGORY_META = {
    lab:       { label:'Lab Report',        cls:'dc-cat-lab',       icon:'fa-solid fa-file-pdf',  iconCls:'dc-ic-pdf' },
    rx:        { label:'Prescription',      cls:'dc-cat-rx',        icon:'fa-solid fa-file-pdf',  iconCls:'dc-ic-pdf' },
    imaging:   { label:'Imaging',           cls:'dc-cat-imaging',   icon:'fa-solid fa-file-image',iconCls:'dc-ic-img' },
    insurance: { label:'Insurance',         cls:'dc-cat-insurance', icon:'fa-solid fa-file-pdf',  iconCls:'dc-ic-pdf' },
    id:        { label:'ID & Registration', cls:'dc-cat-id',        icon:'fa-solid fa-file-lines',iconCls:'dc-ic-doc' }
  };
  const CATEGORY_ACTIONS = {
    lab: [
      { label:'Share with doctor', icon:'fa-solid fa-share' },
      { label:'Add to visit notes', icon:'fa-solid fa-note-sticky' }
    ],
    rx: [
      { label:'Refill prescription', icon:'fa-solid fa-rotate' },
      { label:'Print prescription', icon:'fa-solid fa-print' }
    ],
    imaging: [
      { label:'View DICOM', icon:'fa-solid fa-eye' },
      { label:'Add to imaging history', icon:'fa-solid fa-clock-rotate-left' }
    ],
    insurance: [
      { label:'Update coverage', icon:'fa-solid fa-pen' },
      { label:'View policy details', icon:'fa-solid fa-file-contract' }
    ],
    id: [
      { label:'Set as primary ID', icon:'fa-solid fa-star' },
      { label:'Verify document', icon:'fa-solid fa-check-circle' }
    ]
  };
  const PAGE_SIZE = 8;
  const el = id => document.getElementById(id);

  let documents = [
    { id:1, name:'Full Blood Count Result.pdf', category:'lab', date:'2025-05-16', sizeKB:240, description:'Complete blood count with differential.' },
    { id:2, name:'Prescription — RX-000067.pdf', category:'rx', date:'2025-05-16', sizeKB:98, description:'Amlodipine 5mg, 30-day supply.' },
    { id:3, name:'Chest X-Ray Scan.jpg', category:'imaging', date:'2025-04-28', sizeKB:1800, description:'Anterior-posterior chest X-ray.' },
    { id:4, name:'National ID Card.pdf', category:'id', date:'2025-05-17', sizeKB:310, description:'Government-issued identification.' },
    { id:5, name:'HMO Insurance Card.pdf', category:'insurance', date:'2025-05-17', sizeKB:205, description:'Health Maintenance Organization coverage.' },
    { id:6, name:'Malaria Test Result.pdf', category:'lab', date:'2025-04-12', sizeKB:180, description:'Malaria parasite screening.' }
  ];
  let nextId = 7;

  let state = { search:'', category:'all', sort:'newest', view:'grid', page:1, openMenuId:null };

  function showToast(msg){
    el('toastText').textContent = msg;
    const t = el('toast');
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function sizeLabel(kb){ return kb >= 1024 ? (kb/1024).toFixed(1) + ' MB' : kb + ' KB'; }
  function dateLabel(iso){
    return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  }

  function getFiltered(){
    const q = state.search.trim().toLowerCase();
    let list = documents.filter(d=>{
      if(state.category !== 'all' && d.category !== state.category) return false;
      if(q){
        const meta = CATEGORY_META[d.category];
        if(!(d.name.toLowerCase().includes(q) || meta.label.toLowerCase().includes(q) || (d.description||'').toLowerCase().includes(q))) return false;
      }
      return true;
    });
    list = list.slice().sort((a,b)=>{
      if(state.sort === 'newest') return b.date.localeCompare(a.date) || b.id - a.id;
      if(state.sort === 'oldest') return a.date.localeCompare(b.date) || a.id - b.id;
      if(state.sort === 'name') return a.name.localeCompare(b.name);
      if(state.sort === 'size') return b.sizeKB - a.sizeKB;
      return 0;
    });
    return list;
  }

  function renderCatChips(){
    const CHIP_ORDER = [
      { key:'all', label:'All' },
      { key:'lab', label:'Lab Reports' },
      { key:'rx', label:'Prescriptions' },
      { key:'imaging', label:'Imaging' },
      { key:'insurance', label:'Insurance' },
      { key:'id', label:'ID & Registration' }
    ];
    el('catChips').innerHTML = CHIP_ORDER.map(c=>{
      const count = c.key === 'all' ? documents.length : documents.filter(d=>d.category===c.key).length;
      return `<div class="dc-cat-chip ${state.category===c.key?'active':''}" data-cat="${c.key}">${c.label} <span class="dc-cat-count">${count}</span></div>`;
    }).join('');
    document.querySelectorAll('.dc-cat-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{ state.category = chip.dataset.cat; state.page = 1; render(); });
    });
  }

  function dropdownHtml(doc){
    const common = [
      { action:'view', label:'View / Preview', icon:'fa-solid fa-eye' },
      { action:'download', label:'Download', icon:'fa-solid fa-download' },
      { action:'rename', label:'Rename', icon:'fa-solid fa-pen' },
      { action:'move', label:'Move', icon:'fa-solid fa-folder-open' },
      { action:'delete', label:'Delete', icon:'fa-solid fa-trash-can', danger:true }
    ];
    const catActions = (CATEGORY_ACTIONS[doc.category]||[]).map(a=>({ action:'cat:'+a.label, label:a.label, icon:a.icon }));
    let html = common.map(a=>`<button class="dc-dropdown-item${a.danger?' danger':''}" data-action="${a.action}" data-id="${doc.id}"><i class="${a.icon}"></i> ${a.label}</button>`).join('');
    if(catActions.length){
      html += '<div class="dc-dropdown-divider"></div>';
      html += catActions.map(a=>`<button class="dc-dropdown-item" data-action="${escapeHtml(a.action)}" data-id="${doc.id}"><i class="${a.icon}"></i> ${a.label}</button>`).join('');
    }
    return html;
  }

  function cardHtml(doc){
    const meta = CATEGORY_META[doc.category];
    return `
      <div class="dc-card" data-id="${doc.id}">
        <div class="dc-card-top">
          <div class="dc-file-ic ${meta.iconCls}"><i class="${meta.icon}"></i></div>
          <div class="dc-card-menu" data-menu-id="${doc.id}">
            <i class="fa-solid fa-ellipsis-vertical"></i>
            <div class="dc-dropdown ${state.openMenuId===doc.id?'show':''}" data-dropdown-id="${doc.id}">${dropdownHtml(doc)}</div>
          </div>
        </div>
        <div>
          <div class="dc-file-name">${escapeHtml(doc.name)}</div>
          <div class="dc-file-meta">${dateLabel(doc.date)} · ${sizeLabel(doc.sizeKB)}</div>
        </div>
        <span class="dc-cat-tag ${meta.cls}">${meta.label}</span>
      </div>`;
  }

  function rowHtml(doc){
    const meta = CATEGORY_META[doc.category];
    return `
      <div class="dc-row" data-id="${doc.id}">
        <div class="dc-file-ic ${meta.iconCls}"><i class="${meta.icon}"></i></div>
        <div class="dc-row-name">
          <div class="dc-file-name">${escapeHtml(doc.name)}</div>
          <div class="dc-row-meta">${meta.label}</div>
        </div>
        <div class="dc-row-size">${sizeLabel(doc.sizeKB)}</div>
        <div class="dc-row-date">${dateLabel(doc.date)}</div>
        <div class="dc-card-menu" data-menu-id="${doc.id}">
          <i class="fa-solid fa-ellipsis-vertical"></i>
          <div class="dc-dropdown ${state.openMenuId===doc.id?'show':''}" data-dropdown-id="${doc.id}">${dropdownHtml(doc)}</div>
        </div>
      </div>`;
  }

  function render(){
    renderCatChips();
    const filtered = getFiltered();
    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if(state.page > totalPages) state.page = totalPages;
    if(state.page < 1) state.page = 1;
    const start = (state.page-1)*PAGE_SIZE;
    const pageItems = filtered.slice(start, start+PAGE_SIZE);

    el('dcGrid').innerHTML = pageItems.map(cardHtml).join('');
    el('dcList').innerHTML = pageItems.map(rowHtml).join('');
    el('dcGrid').classList.toggle('hide', state.view !== 'grid');
    el('dcList').classList.toggle('show', state.view === 'list');

    el('emptyState').style.display = filtered.length ? 'none' : 'block';

    if(filtered.length === 0){
      el('paginationBar').style.display = 'none';
    } else {
      el('paginationBar').style.display = 'flex';
      const from = start+1, to = Math.min(start+PAGE_SIZE, filtered.length);
      el('pageInfo').textContent = `Showing ${from}–${to} of ${filtered.length} document${filtered.length===1?'':'s'}`;
      let btns = `<div class="dc-page-btn" id="prevPage" ${state.page===1?'disabled':''}><i class="fa-solid fa-chevron-left"></i></div>`;
      for(let p=1;p<=totalPages;p++) btns += `<div class="dc-page-btn ${p===state.page?'active':''}" data-page="${p}">${p}</div>`;
      btns += `<div class="dc-page-btn" id="nextPage" ${state.page===totalPages?'disabled':''}><i class="fa-solid fa-chevron-right"></i></div>`;
      el('pageControls').innerHTML = btns;
    }

    attachListeners();
  }

  function attachListeners(){
    document.querySelectorAll('[data-menu-id]').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        const id = Number(btn.dataset.menuId);
        state.openMenuId = state.openMenuId === id ? null : id;
        render();
      });
    });
    document.querySelectorAll('.dc-dropdown-item').forEach(item=>{
      item.addEventListener('click', e=>{
        e.stopPropagation();
        const id = Number(item.dataset.id);
        const action = item.dataset.action;
        state.openMenuId = null;
        handleAction(action, id);
      });
    });
    document.querySelectorAll('#pageControls [data-page]').forEach(b=>{
      b.addEventListener('click', ()=>{ state.page = Number(b.dataset.page); render(); window.scrollTo({top:0,behavior:'smooth'}); });
    });
    const prev = el('prevPage'), next = el('nextPage');
    if(prev) prev.addEventListener('click', ()=>{ if(state.page>1){ state.page--; render(); } });
    if(next) next.addEventListener('click', ()=>{ state.page++; render(); });
  }

  document.addEventListener('click', ()=>{
    if(state.openMenuId !== null){ state.openMenuId = null; render(); }
  });

  function handleAction(action, id){
    const doc = documents.find(d=>d.id===id);
    if(!doc) return;
    if(action === 'view') return openPreview(id);
    if(action === 'download') return downloadDoc(id);
    if(action === 'rename') return openRenameModal(id);
    if(action === 'move') return openMoveModal(id);
    if(action === 'delete') return deleteDoc(id);
    if(action.startsWith('cat:')){
      showToast(`${action.slice(4)} — ${doc.name}`);
      return;
    }
  }

  // ---- filters ----
  el('searchInput').addEventListener('input', e=>{ state.search = e.target.value; state.page=1; render(); });
  el('sortSelect').addEventListener('change', e=>{ state.sort = e.target.value; state.page=1; render(); });
  document.querySelectorAll('.dc-viewtoggle-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.dc-viewtoggle-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.view = btn.dataset.view;
      render();
    });
  });

  // ---- upload modal ----
  function openUploadModal(){
    el('fName').value = '';
    el('fCategory').value = 'lab';
    el('fDesc').value = '';
    el('uploadModal').classList.add('open');
  }
  function closeUploadModal(){ el('uploadModal').classList.remove('open'); }
  el('uploadBtn').addEventListener('click', openUploadModal);
  el('uploadClose').addEventListener('click', closeUploadModal);
  el('uploadCancel').addEventListener('click', closeUploadModal);
  el('uploadModal').addEventListener('click', e=>{ if(e.target.id==='uploadModal') closeUploadModal(); });

  el('uploadSubmit').addEventListener('click', ()=>{
    const name = el('fName').value.trim();
    if(!name){ showToast('Please enter a file name'); return; }
    const now = new Date();
    documents.unshift({
      id: nextId++,
      name,
      category: el('fCategory').value,
      date: now.toISOString().slice(0,10),
      sizeKB: 80 + Math.floor(Math.random()*420),
      description: el('fDesc').value.trim() || 'No description provided.'
    });
    closeUploadModal();
    state.category = 'all';
    state.page = 1;
    showToast('Document uploaded');
    render();
  });

  // ---- rename modal ----
  let renameTargetId = null;
  function openRenameModal(id){
    const doc = documents.find(d=>d.id===id);
    if(!doc) return;
    renameTargetId = id;
    el('fRenameValue').value = doc.name;
    el('renameModal').classList.add('open');
  }
  function closeRenameModal(){ el('renameModal').classList.remove('open'); renameTargetId = null; }
  el('renameClose').addEventListener('click', closeRenameModal);
  el('renameCancel').addEventListener('click', closeRenameModal);
  el('renameModal').addEventListener('click', e=>{ if(e.target.id==='renameModal') closeRenameModal(); });
  el('renameSubmit').addEventListener('click', ()=>{
    const doc = documents.find(d=>d.id===renameTargetId);
    const val = el('fRenameValue').value.trim();
    if(!doc || !val){ showToast('Please enter a file name'); return; }
    doc.name = val;
    closeRenameModal();
    showToast('Document renamed');
    render();
  });

  // ---- move modal ----
  let moveTargetId = null;
  function openMoveModal(id){
    const doc = documents.find(d=>d.id===id);
    if(!doc) return;
    moveTargetId = id;
    el('fMoveCategory').value = doc.category;
    el('moveModal').classList.add('open');
  }
  function closeMoveModal(){ el('moveModal').classList.remove('open'); moveTargetId = null; }
  el('moveClose').addEventListener('click', closeMoveModal);
  el('moveCancel').addEventListener('click', closeMoveModal);
  el('moveModal').addEventListener('click', e=>{ if(e.target.id==='moveModal') closeMoveModal(); });
  el('moveSubmit').addEventListener('click', ()=>{
    const doc = documents.find(d=>d.id===moveTargetId);
    if(!doc) return;
    doc.category = el('fMoveCategory').value;
    closeMoveModal();
    showToast('Moved to ' + CATEGORY_META[doc.category].label);
    render();
  });

  // ---- delete ----
  function deleteDoc(id){
    const doc = documents.find(d=>d.id===id);
    if(!doc) return;
    if(!confirm(`Delete "${doc.name}"? This can't be undone.`)) return;
    documents = documents.filter(d=>d.id!==id);
    showToast('Document deleted');
    render();
  }

  // ---- preview ----
  function openPreview(id){
    const doc = documents.find(d=>d.id===id);
    if(!doc) return;
    const meta = CATEGORY_META[doc.category];
    el('previewTitle').textContent = doc.name;
    el('previewMeta').innerHTML = `
      <div class="preview-meta-item"><span>Category</span><span class="dc-cat-tag ${meta.cls}">${meta.label}</span></div>
      <div class="preview-meta-item"><span>Date</span>${dateLabel(doc.date)}</div>
      <div class="preview-meta-item"><span>Size</span>${sizeLabel(doc.sizeKB)}</div>
      <div class="preview-meta-item"><span>File</span>${escapeHtml(doc.name)}</div>
    `;
    el('previewDesc').textContent = doc.description || '';
    el('previewBox').innerHTML = `<i class="${meta.icon}"></i><div>Preview would display the actual document content here.</div>`;
    el('previewDownloadBtn').dataset.id = id;
    el('previewModal').classList.add('open');
  }
  function closePreview(){ el('previewModal').classList.remove('open'); }
  el('previewClose').addEventListener('click', closePreview);
  el('previewModal').addEventListener('click', e=>{ if(e.target.id==='previewModal') closePreview(); });
  el('previewDownloadBtn').addEventListener('click', e=> downloadDoc(Number(e.currentTarget.dataset.id)));

  // ---- real download (demo placeholder file) ----
  function downloadDoc(id){
    const doc = documents.find(d=>d.id===id);
    if(!doc) return;
    const meta = CATEGORY_META[doc.category];
    const content = `Shiloh Clinic & Maternity\nDocument: ${doc.name}\nCategory: ${meta.label}\nDate: ${dateLabel(doc.date)}\nSize: ${sizeLabel(doc.sizeKB)}\n\n${doc.description||''}\n\n(This is a placeholder file for demo purposes.)`;
    const blob = new Blob([content], { type:'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = doc.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Downloaded ' + doc.name);
  }

  el('backBtn').addEventListener('click', ()=> showToast('Back to profile (demo)'));

  render();
})();
</script>
</body>
</html>
