<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiloh Clinic & Maternity — Visit History</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --navy:#0b1a4d; --blue-accent:#2f6fed; --bg:#f4f6fb; --card:#ffffff; --border:#eef0f6;
    --text-dark:#1c2440; --text-mid:#6b7280; --text-light:#9aa1b3;
    --green:#12b76a; --green-bg:#e9f9f0;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    --orange:#f79009; --orange-bg:#fff4e5;
    --red:#f04438; --red-bg:#feecec;
    --pink:#ee46bc; --pink-bg:#fdeefa;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    background:var(--bg); color:var(--text-dark); font-size:13px; padding:26px;
    display:flex; justify-content:center;
  }

  .page-wrap{width:100%; max-width:1100px;}

  .back-btn{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:10px;
    padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--text-dark);white-space:nowrap;cursor:pointer;
    margin-bottom:16px;max-width:fit-content;
  }
  .back-btn:hover{background:var(--bg);}
  .back-btn i{color:var(--text-mid);font-size:11px;}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;}

  .vh-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .vh-title{font-size:15px;font-weight:800;color:var(--text-dark);}
  .vh-sub{font-size:11.5px;color:var(--text-light);font-weight:600;margin-top:2px;}
  .btn-primary{
    display:flex;align-items:center;gap:8px;background:var(--blue-accent);border:1px solid var(--blue-accent);
    border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;cursor:pointer;
    box-shadow:0 4px 10px rgba(47,111,237,0.28);
  }
  .btn-primary:hover{background:#2660d6;}
  .btn-primary i{font-size:10px;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
  .btn-secondary{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);
    border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;color:var(--text-mid);white-space:nowrap;cursor:pointer;
  }
  .btn-secondary:hover{background:var(--bg);color:var(--text-dark);}

  /* filter bar */
  .vh-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .vh-search{
    display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);
    border-radius:10px;padding:9px 12px;flex:1;min-width:200px;
  }
  .vh-search i{color:var(--text-light);font-size:12px;}
  .vh-search input{border:none;background:transparent;outline:none;font-size:12.5px;color:var(--text-dark);width:100%;font-family:inherit;}
  .vh-search input::placeholder{color:var(--text-light);}
  .vh-select{
    background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 12px;
    font-size:12.5px;font-weight:600;color:var(--text-dark);cursor:pointer;font-family:inherit;
  }
  .vh-daterange{
    display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);
    border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--text-dark);cursor:pointer;
    white-space:nowrap; font-family:inherit;
  }
  .vh-daterange i{color:var(--text-light);font-size:11px;}
  .vh-filters-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .vh-reset{font-size:11.5px;color:var(--blue-accent);font-weight:700;cursor:pointer;white-space:nowrap;}
  .vh-reset:hover{text-decoration:underline;}

  /* stat chips */
  .vh-stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .vh-stat{
    flex:1;min-width:130px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;
    display:flex;align-items:center;gap:10px;
  }
  .vh-stat-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .vh-stat-label{font-size:10.5px;color:var(--text-mid);font-weight:700;}
  .vh-stat-value{font-size:16px;font-weight:800;color:var(--text-dark);}

  /* table */
  .vh-table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:left;font-size:10.5px;letter-spacing:.03em;color:var(--text-light);text-transform:uppercase;
    font-weight:700;padding:10px 8px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  tbody td{padding:12px 8px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:middle;color:var(--text-dark);font-weight:600;white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafbfe;}

  .vh-visitno{color:var(--blue);font-weight:800;cursor:pointer;}
  .vh-visitno:hover{text-decoration:underline;}
  .vh-date-main{font-weight:700;}
  .vh-date-time{display:block;font-size:11px;color:var(--text-light);font-weight:600;margin-top:1px;}

  .vh-type-tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:7px;display:inline-block;}
  .vh-type-consultation{background:var(--blue-bg);color:#1d54c9;}
  .vh-type-followup{background:var(--purple-bg);color:#6b3fd6;}
  .vh-type-emergency{background:var(--red-bg);color:#c1362b;}
  .vh-type-antenatal{background:var(--pink-bg);color:#c2299c;}

  .badge-completed{background:var(--green-bg);color:#0a8a52;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;display:inline-block;}
  .badge-progress{background:var(--orange-bg);color:#c56c05;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;display:inline-block;}
  .badge-cancelled{background:var(--red-bg);color:#c1362b;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;display:inline-block;}

  .vh-row-actions{display:flex;align-items:center;gap:6px;}
  .vh-icon-btn{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--text-mid);font-size:11px;cursor:pointer;
  }
  .vh-icon-btn:hover{color:var(--blue);border-color:var(--blue-bg);background:var(--blue-bg);}

  .empty-state{padding:44px 10px;text-align:center;color:var(--text-light);}
  .empty-state i{font-size:26px;margin-bottom:10px;display:block;color:var(--text-light);}
  .empty-state div{font-size:12.5px;font-weight:600;}

  /* pagination */
  .vh-pagination{display:flex;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap;gap:10px;}
  .vh-page-info{font-size:11.5px;color:var(--text-mid);font-weight:600;}
  .vh-page-controls{display:flex;align-items:center;gap:6px;}
  .vh-page-btn{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-mid);cursor:pointer;
  }
  .vh-page-btn:hover:not(.active):not(:disabled){border-color:var(--blue-accent);color:var(--blue-accent);}
  .vh-page-btn.active{background:var(--blue-accent);border-color:var(--blue-accent);color:#fff;cursor:default;}
  .vh-page-btn:disabled{opacity:.4;cursor:default;}
  .vh-page-ellipsis{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--text-light);font-weight:700;}

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,20,40,0.45);display:none;align-items:center;justify-content:center;
    z-index:200;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(10,15,40,0.25);max-height:90vh;overflow-y:auto;}
  .modal-box.wide{max-width:560px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-title{font-size:15px;font-weight:800;color:var(--text-dark);}
  .modal-close{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-mid);cursor:pointer;font-size:13px;}
  .modal-close:hover{background:var(--bg);}

  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .detail-item{display:flex;flex-direction:column;gap:3px;}
  .detail-label{font-size:10px;font-weight:800;color:var(--text-light);text-transform:uppercase;letter-spacing:.03em;}
  .detail-value{font-size:13px;font-weight:700;color:var(--text-dark);}

  .form-group{margin-bottom:14px;}
  .form-label{font-size:11px;font-weight:800;color:var(--text-mid);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;display:block;}
  .form-input, .form-select{
    width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:inherit;
    font-size:12.5px;color:var(--text-dark);outline:none;background:#fff;
  }
  .form-input:focus, .form-select:focus{border-color:var(--blue-accent);}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
    padding:11px 20px;border-radius:10px;font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(10,15,40,0.3);
    opacity:0;pointer-events:none;transition:.22s; z-index:300; display:flex; align-items:center; gap:9px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast i{color:var(--green);}

  @media (max-width:720px){
    body{padding:14px;}
    .vh-stats{flex-direction:column;}
    .detail-grid, .form-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="page-wrap">

  <div class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Back to Profile</div>

  <div class="panel">

    <div class="vh-head">
      <div>
        <div class="vh-title">Visit History</div>
        <div class="vh-sub">All recorded visits for this patient</div>
      </div>
      <div class="btn-primary" id="newVisitBtn"><i class="fa-solid fa-plus"></i> New Visit</div>
    </div>

    <!-- summary chips -->
    <div class="vh-stats" id="statsRow"></div>

    <!-- filters -->
    <div class="vh-filters">
      <div class="vh-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search by visit no. or doctor…">
      </div>
      <select class="vh-select" id="deptFilter">
        <option value="all">All Departments</option>
        <option value="General OPD">General OPD</option>
        <option value="Maternity">Maternity</option>
        <option value="Laboratory">Laboratory</option>
        <option value="Pharmacy">Pharmacy</option>
      </select>
      <select class="vh-select" id="statusFilter">
        <option value="all">All Statuses</option>
        <option value="Completed">Completed</option>
        <option value="In Progress">In Progress</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <select class="vh-daterange" id="dateFilter">
        <option value="all">All Dates</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
      <div class="vh-filters-right">
        <div class="vh-reset" id="resetFilters">Reset filters</div>
      </div>
    </div>

    <!-- table -->
    <div class="vh-table-scroll">
      <table>
        <thead>
          <tr>
            <th>Visit No.</th>
            <th>Date &amp; Time</th>
            <th>Department</th>
            <th>Doctor</th>
            <th>Type</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="visitTableBody"></tbody>
      </table>
    </div>

    <div class="empty-state" id="emptyState" style="display:none;">
      <i class="fa-regular fa-folder-open"></i>
      <div>No visits match your filters</div>
    </div>

    <!-- pagination -->
    <div class="vh-pagination" id="paginationBar">
      <div class="vh-page-info" id="pageInfo"></div>
      <div class="vh-page-controls" id="pageControls"></div>
    </div>

  </div>

</div>

<!-- view visit modal -->
<div class="modal-overlay" id="viewModal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="viewModalTitle">Visit detail</div>
      <div class="modal-close" id="viewModalClose"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div class="detail-grid" id="viewModalBody"></div>
    <div class="modal-actions">
      <div class="btn-secondary" id="viewPrintBtn"><i class="fa-solid fa-print"></i> Print</div>
    </div>
  </div>
</div>

<!-- new visit modal -->
<div class="modal-overlay" id="newVisitModal">
  <div class="modal-box wide">
    <div class="modal-head">
      <div class="modal-title">Log a new visit</div>
      <div class="modal-close" id="newVisitClose"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Department</label>
        <select class="form-select" id="fDept">
          <option>General OPD</option>
          <option>Maternity</option>
          <option>Laboratory</option>
          <option>Pharmacy</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Visit type</label>
        <select class="form-select" id="fType">
          <option value="consultation">Consultation</option>
          <option value="followup">Follow-up</option>
          <option value="emergency">Emergency</option>
          <option value="antenatal">Antenatal</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Doctor</label>
        <select class="form-select" id="fDoctor">
          <option>Dr. Samuel O.</option>
          <option>Dr. Amaka N.</option>
          <option>Dr. Bello T.</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="fStatus">
          <option>Completed</option>
          <option>In Progress</option>
          <option>Cancelled</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Notes (optional)</label>
      <input class="form-input" id="fNotes" placeholder="Reason for visit, quick summary…">
    </div>
    <div class="modal-actions">
      <div class="btn-secondary" id="newVisitCancel">Cancel</div>
      <div class="btn-primary" id="newVisitSubmit"><i class="fa-solid fa-check"></i> Save Visit</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toastText">Saved</span></div>

<script>
(function(){
  const TYPE_META = {
    consultation:{ label:'Consultation', cls:'vh-type-consultation' },
    followup:{ label:'Follow-up', cls:'vh-type-followup' },
    emergency:{ label:'Emergency', cls:'vh-type-emergency' },
    antenatal:{ label:'Antenatal', cls:'vh-type-antenatal' }
  };
  const STATUS_META = {
    'Completed':'badge-completed',
    'In Progress':'badge-progress',
    'Cancelled':'badge-cancelled'
  };
  const PAGE_SIZE = 5;
  const DEPTS = ['General OPD','Maternity','Laboratory','Pharmacy'];
  const DOCTORS = ['Dr. Samuel O.','Dr. Amaka N.','Dr. Bello T.'];
  const TYPES = ['consultation','followup','emergency','antenatal'];
  const STATUSES_POOL = ['Completed','Completed','Completed','Completed','In Progress','Cancelled'];

  const el = id => document.getElementById(id);

  // ---- seed demo data: 48 visits, most recent first ----
  let visits = [];
  let nextNum = 89;
  (function seed(){
    let d = new Date('2025-05-16T09:40:00');
    for(let i=0; i<48; i++){
      const dept = DEPTS[Math.floor(Math.abs(Math.sin(i*3.1))*DEPTS.length) % DEPTS.length];
      const doctor = dept === 'Maternity' ? 'Dr. Amaka N.' : DOCTORS[Math.floor(Math.abs(Math.sin(i*1.7))*DOCTORS.length) % DOCTORS.length];
      const type = dept === 'Maternity' ? 'antenatal' : TYPES[Math.floor(Math.abs(Math.sin(i*2.3))*TYPES.length) % TYPES.length];
      let status = STATUSES_POOL[Math.floor(Math.abs(Math.sin(i*4.1))*STATUSES_POOL.length) % STATUSES_POOL.length];
      if(i===3) status='In Progress';
      const hour = 8 + (i % 8);
      const minute = (i*7)%60;
      const visitDate = new Date(d);
      visits.push({
        id: i+1,
        visitNo: 'VIS-' + String(nextNum - i).padStart(6,'0'),
        dept, doctor, type, status,
        ts: visitDate.getTime(),
        date: visitDate.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
        time: `${String(hour%12===0?12:hour%12).padStart(2,'0')}:${String(minute).padStart(2,'0')} ${hour<12?'AM':'PM'}`,
        notes: dept==='Maternity' ? 'Routine antenatal check-up, fundal height and fetal heart rate recorded.' :
               type==='emergency' ? 'Presented with acute symptoms, seen urgently and stabilized.' :
               type==='followup' ? 'Routine follow-up on prior treatment plan.' :
               'General consultation for reported symptoms.'
      });
      // step back 1-4 days between visits
      d.setDate(d.getDate() - (1 + (i%4)));
    }
  })();
  let nextId = visits.length + 1;

  let state = { search:'', dept:'all', status:'all', date:'all', page:1 };

  function showToast(msg){
    el('toastText').textContent = msg;
    const t = el('toast');
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(()=>t.classList.remove('show'), 1800);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function getFiltered(){
    const q = state.search.trim().toLowerCase();
    const now = Date.now();
    return visits.filter(v=>{
      if(state.dept !== 'all' && v.dept !== state.dept) return false;
      if(state.status !== 'all' && v.status !== state.status) return false;
      if(state.date !== 'all'){
        const days = Number(state.date);
        if(now - v.ts > days*24*60*60*1000) return false;
      }
      if(q && !(v.visitNo.toLowerCase().includes(q) || v.doctor.toLowerCase().includes(q))) return false;
      return true;
    }).sort((a,b)=> b.ts - a.ts);
  }

  function renderStats(){
    const total = visits.length;
    const completed = visits.filter(v=>v.status==='Completed').length;
    const progress = visits.filter(v=>v.status==='In Progress').length;
    const cancelled = visits.filter(v=>v.status==='Cancelled').length;
    el('statsRow').innerHTML = `
      <div class="vh-stat"><div class="vh-stat-ic" style="background:var(--blue-bg);color:var(--blue);"><i class="fa-solid fa-user-group"></i></div>
        <div><div class="vh-stat-label">Total Visits</div><div class="vh-stat-value">${total}</div></div></div>
      <div class="vh-stat"><div class="vh-stat-ic" style="background:var(--green-bg);color:var(--green);"><i class="fa-solid fa-circle-check"></i></div>
        <div><div class="vh-stat-label">Completed</div><div class="vh-stat-value">${completed}</div></div></div>
      <div class="vh-stat"><div class="vh-stat-ic" style="background:var(--orange-bg);color:var(--orange);"><i class="fa-solid fa-hourglass-half"></i></div>
        <div><div class="vh-stat-label">In Progress</div><div class="vh-stat-value">${progress}</div></div></div>
      <div class="vh-stat"><div class="vh-stat-ic" style="background:var(--red-bg);color:var(--red);"><i class="fa-solid fa-ban"></i></div>
        <div><div class="vh-stat-label">Cancelled</div><div class="vh-stat-value">${cancelled}</div></div></div>
    `;
  }

  function renderRow(v){
    const tmeta = TYPE_META[v.type];
    const badgeCls = STATUS_META[v.status];
    return `
      <tr data-id="${v.id}">
        <td><span class="vh-visitno" data-action="view" data-id="${v.id}">${v.visitNo}</span></td>
        <td><span class="vh-date-main">${v.date}</span><span class="vh-date-time">${v.time}</span></td>
        <td>${escapeHtml(v.dept)}</td>
        <td>${escapeHtml(v.doctor)}</td>
        <td><span class="vh-type-tag ${tmeta.cls}">${tmeta.label}</span></td>
        <td><span class="${badgeCls}">${v.status}</span></td>
        <td>
          <div class="vh-row-actions">
            <div class="vh-icon-btn" data-action="view" data-id="${v.id}" title="View"><i class="fa-regular fa-eye"></i></div>
            <div class="vh-icon-btn" data-action="print" data-id="${v.id}" title="Print"><i class="fa-solid fa-print"></i></div>
          </div>
        </td>
      </tr>`;
  }

  function render(){
    renderStats();
    const all = getFiltered();
    const totalPages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
    if(state.page > totalPages) state.page = totalPages;
    if(state.page < 1) state.page = 1;
    const start = (state.page-1)*PAGE_SIZE;
    const pageItems = all.slice(start, start+PAGE_SIZE);

    el('visitTableBody').innerHTML = pageItems.map(renderRow).join('');
    document.querySelector('.vh-table-scroll').style.display = all.length ? 'block' : 'none';
    el('emptyState').style.display = all.length ? 'none' : 'block';

    if(all.length === 0){
      el('paginationBar').style.display = 'none';
    } else {
      el('paginationBar').style.display = 'flex';
      const from = start+1, to = Math.min(start+PAGE_SIZE, all.length);
      el('pageInfo').textContent = `Showing ${from}–${to} of ${all.length} visit${all.length===1?'':'s'}`;
      el('pageControls').innerHTML = buildPageControls(state.page, totalPages);
    }

    attachRowListeners();
  }

  function buildPageControls(page, totalPages){
    let html = `<div class="vh-page-btn" id="prevPage" ${page===1?'disabled':''}><i class="fa-solid fa-chevron-left"></i></div>`;
    const pages = [];
    const add = p => { if(p>=1 && p<=totalPages && !pages.includes(p)) pages.push(p); };
    add(1); add(2); add(totalPages-1); add(totalPages);
    for(let p=page-1;p<=page+1;p++) add(p);
    pages.sort((a,b)=>a-b);
    let last = 0;
    pages.forEach(p=>{
      if(p - last > 1) html += `<div class="vh-page-ellipsis">…</div>`;
      html += `<div class="vh-page-btn ${p===page?'active':''}" data-page="${p}">${p}</div>`;
      last = p;
    });
    html += `<div class="vh-page-btn" id="nextPage" ${page===totalPages?'disabled':''}><i class="fa-solid fa-chevron-right"></i></div>`;
    return html;
  }

  function attachRowListeners(){
    document.querySelectorAll('[data-action="view"]').forEach(elx=>{
      elx.addEventListener('click', ()=> openViewModal(Number(elx.dataset.id)));
    });
    document.querySelectorAll('[data-action="print"]').forEach(elx=>{
      elx.addEventListener('click', (e)=>{
        e.stopPropagation();
        printVisit(Number(elx.dataset.id));
      });
    });
    document.querySelectorAll('#pageControls [data-page]').forEach(b=>{
      b.addEventListener('click', ()=>{ state.page = Number(b.dataset.page); render(); window.scrollTo({top:0,behavior:'smooth'}); });
    });
    const prev = el('prevPage'), next = el('nextPage');
    if(prev) prev.addEventListener('click', ()=>{ if(state.page>1){ state.page--; render(); } });
    if(next) next.addEventListener('click', ()=>{ state.page++; render(); });
  }

  function openViewModal(id){
    const v = visits.find(x=>x.id===id);
    if(!v) return;
    const tmeta = TYPE_META[v.type];
    const badgeCls = STATUS_META[v.status];
    el('viewModalTitle').textContent = v.visitNo;
    el('viewModalBody').innerHTML = `
      <div class="detail-item"><span class="detail-label">Date &amp; Time</span><span class="detail-value">${v.date} · ${v.time}</span></div>
      <div class="detail-item"><span class="detail-label">Department</span><span class="detail-value">${escapeHtml(v.dept)}</span></div>
      <div class="detail-item"><span class="detail-label">Doctor</span><span class="detail-value">${escapeHtml(v.doctor)}</span></div>
      <div class="detail-item"><span class="detail-label">Type</span><span class="detail-value"><span class="vh-type-tag ${tmeta.cls}">${tmeta.label}</span></span></div>
      <div class="detail-item"><span class="detail-label">Status</span><span class="detail-value"><span class="${badgeCls}">${v.status}</span></span></div>
      <div class="detail-item" style="grid-column:1/-1;"><span class="detail-label">Notes</span><span class="detail-value" style="font-weight:600;">${escapeHtml(v.notes)}</span></div>
    `;
    el('viewPrintBtn').dataset.id = id;
    el('viewModal').classList.add('open');
  }
  function closeViewModal(){ el('viewModal').classList.remove('open'); }
  el('viewModalClose').addEventListener('click', closeViewModal);
  el('viewModal').addEventListener('click', (e)=>{ if(e.target.id==='viewModal') closeViewModal(); });
  el('viewPrintBtn').addEventListener('click', (e)=> printVisit(Number(e.currentTarget.dataset.id)));

  function printVisit(id){
    const v = visits.find(x=>x.id===id);
    if(!v) return;
    showToast(`Preparing ${v.visitNo} for print… (demo)`);
  }

  // new visit modal
  function openNewVisitModal(){
    el('fDept').value = 'General OPD';
    el('fType').value = 'consultation';
    el('fDoctor').value = 'Dr. Samuel O.';
    el('fStatus').value = 'Completed';
    el('fNotes').value = '';
    el('newVisitModal').classList.add('open');
  }
  function closeNewVisitModal(){ el('newVisitModal').classList.remove('open'); }
  el('newVisitBtn').addEventListener('click', openNewVisitModal);
  el('newVisitClose').addEventListener('click', closeNewVisitModal);
  el('newVisitCancel').addEventListener('click', closeNewVisitModal);
  el('newVisitModal').addEventListener('click', (e)=>{ if(e.target.id==='newVisitModal') closeNewVisitModal(); });

  el('newVisitSubmit').addEventListener('click', ()=>{
    const now = new Date();
    const dept = el('fDept').value;
    nextNum += 1;
    visits.unshift({
      id: nextId++,
      visitNo: 'VIS-' + String(nextNum).padStart(6,'0'),
      dept,
      doctor: el('fDoctor').value,
      type: el('fType').value,
      status: el('fStatus').value,
      ts: now.getTime(),
      date: now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
      time: now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}),
      notes: el('fNotes').value.trim() || 'No additional notes recorded.'
    });
    closeNewVisitModal();
    state.page = 1;
    showToast('Visit logged');
    render();
  });

  // filters
  el('searchInput').addEventListener('input', e=>{ state.search = e.target.value; state.page=1; render(); });
  el('deptFilter').addEventListener('change', e=>{ state.dept = e.target.value; state.page=1; render(); });
  el('statusFilter').addEventListener('change', e=>{ state.status = e.target.value; state.page=1; render(); });
  el('dateFilter').addEventListener('change', e=>{ state.date = e.target.value; state.page=1; render(); });
  el('resetFilters').addEventListener('click', ()=>{
    state = { search:'', dept:'all', status:'all', date:'all', page:1 };
    el('searchInput').value = '';
    el('deptFilter').value = 'all';
    el('statusFilter').value = 'all';
    el('dateFilter').value = 'all';
    render();
    showToast('Filters reset');
  });

  el('backBtn').addEventListener('click', ()=> showToast('Back to profile (demo)'));

  render();
})();
</script>
</body>
</html>
