<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiloh Clinic & Maternity — Patient Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --navy:#0b1a4d; --navy-2:#101f5c; --blue-accent:#2f6fed;
    --bg:#f4f6fb; --card:#ffffff; --border:#eef0f6;
    --text-dark:#1c2440; --text-mid:#6b7280; --text-light:#9aa1b3;
    --green:#12b76a; --green-bg:#e9f9f0;
    --blue:#2f6fed; --blue-bg:#eaf1ff;
    --purple:#8b5cf6; --purple-bg:#f4efff;
    --orange:#f79009; --orange-bg:#fff4e5;
    --pink:#ee46bc; --pink-bg:#fdeefa;
    --red:#f04438; --red-bg:#feecec;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text-dark);display:flex;min-height:100vh;font-size:13px;}
  .main{flex:1;min-width:0;padding:20px 26px 40px;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px;}
  .topbar-left{display:flex;align-items:flex-start;gap:14px;}
  .back-btn{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--text-dark);cursor:pointer;margin-top:2px;}
  .back-btn i{color:var(--text-mid);font-size:11px;}
  .page-title{font-size:20px;font-weight:800;color:var(--text-dark);line-height:1.25;}
  .breadcrumb{font-size:11.5px;color:var(--text-light);font-weight:600;margin-top:3px;}
  .breadcrumb a{color:var(--blue);text-decoration:none;}
  .topbar-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .btn-outline{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;color:var(--text-dark);cursor:pointer;}
  .btn-outline i{color:var(--text-mid);font-size:12px;}
  .btn-primary{display:flex;align-items:center;gap:8px;background:var(--blue-accent);border:1px solid var(--blue-accent);border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 4px 10px rgba(47,111,237,0.28);}

  .patient-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap;}
  .patient-id-block{display:flex;align-items:center;gap:16px;}
  .patient-photo{position:relative;flex-shrink:0;}
  .patient-photo img{width:74px;height:74px;border-radius:14px;object-fit:cover;}
  .photo-edit{position:absolute;bottom:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:var(--blue-accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid #fff;cursor:pointer;}
  .patient-name-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .patient-name{font-size:19px;font-weight:800;color:var(--text-dark);}
  .badge-status{background:var(--green-bg);color:#0a8a52;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
  .badge-status i{font-size:8px;}
  .hosp-no-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .hosp-label{font-size:10.5px;color:var(--text-light);font-weight:600;}
  .hosp-no{font-size:13px;font-weight:800;color:var(--blue);}
  .qr-icon-btn{width:24px;height:24px;border-radius:6px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;}
  .patient-meta-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .meta-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-mid);font-weight:600;}
  .meta-item i{font-size:11px;color:var(--text-light);}
  .contact-grid{display:flex;gap:34px;flex-wrap:wrap;}
  .contact-item{display:flex;align-items:flex-start;gap:9px;}
  .contact-item i{width:30px;height:30px;border-radius:8px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:1px;}
  .contact-label{font-size:10.5px;color:var(--text-light);font-weight:600;margin-bottom:2px;}
  .contact-value{font-size:12.5px;font-weight:700;color:var(--text-dark);}

  .tabs-bar{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px;margin-bottom:18px;overflow-x:auto;}
  .tab-item{padding:9px 16px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--text-mid);white-space:nowrap;cursor:pointer;transition:all .15s;}
  .tab-item.active{background:var(--blue-accent);color:#fff;box-shadow:0 4px 10px rgba(47,111,237,0.3);}
  .tab-item:hover:not(.active){color:var(--text-dark);background:rgba(47,111,237,0.06);}

  .profile-grid{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start;}
  .left-col{display:flex;flex-direction:column;gap:16px;min-width:0;}
  .right-col{display:flex;flex-direction:column;gap:16px;}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .panel-title{font-size:14px;font-weight:800;color:var(--text-dark);}
  .edit-link{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--blue);border:1px solid var(--blue-bg);background:var(--blue-bg);padding:6px 12px;border-radius:8px;cursor:pointer;}
  .edit-link:hover{background:var(--blue);color:#fff;}

  .info-two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;}
  .info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);gap:10px;}
  .info-row:last-child{border-bottom:none;}
  .info-label{font-size:12px;color:var(--text-mid);font-weight:600;flex-shrink:0;}
  .info-value{font-size:12px;color:var(--text-dark);font-weight:700;text-align:right;}
  .contact-address-grid{display:flex;flex-direction:column;gap:14px;}
  .ca-row{display:flex;align-items:flex-start;gap:11px;}
  .ca-ic{width:32px;height:32px;border-radius:9px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .ca-label{font-size:10.5px;color:var(--text-light);font-weight:600;margin-bottom:2px;}
  .ca-value{font-size:12.5px;color:var(--text-dark);font-weight:700;}
  .ca-divider{border-top:1px solid var(--border);margin:2px 0;}

  .summary-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
  .summary-card{border:1px solid var(--border);border-radius:12px;padding:13px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:all .15s;}
  .summary-card:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(47,111,237,0.12);}
  .summary-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;}
  .summary-label{font-size:10.5px;color:var(--text-mid);font-weight:700;}
  .summary-value{font-size:19px;font-weight:800;color:var(--text-dark);}
  .summary-link{font-size:10.5px;color:var(--blue);font-weight:700;display:flex;align-items:center;gap:3px;margin-top:auto;}

  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-size:10.5px;letter-spacing:.03em;color:var(--text-light);text-transform:uppercase;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--border);}
  tbody td{padding:11px 6px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:middle;color:var(--text-dark);font-weight:600;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{cursor:pointer;transition:background .1s;}
  tbody tr:hover{background:rgba(47,111,237,0.04);}
  .badge-completed{background:var(--green-bg);color:#0a8a52;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;display:inline-block;}
  .badge-dispensed{background:var(--green-bg);color:#0a8a52;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;display:inline-block;}
  .badge-pending{background:var(--orange-bg);color:#c56c05;font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;display:inline-block;}
  .two-table-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

  .qa-grid{display:flex;flex-direction:column;gap:9px;}
  .qa-btn{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s;}
  .qa-btn:hover{transform:translateX(4px);}
  .qa-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0;}
  .qa-checkin{background:var(--green-bg);color:#0a8a52;} .qa-checkin .qa-ic{background:var(--green);}
  .qa-book{background:var(--purple-bg);color:#6b3fd6;} .qa-book .qa-ic{background:var(--purple);}
  .qa-visit{background:var(--blue-bg);color:#1d54c9;} .qa-visit .qa-ic{background:var(--blue);}
  .qa-print{background:var(--orange-bg);color:#c56c05;} .qa-print .qa-ic{background:var(--orange);}
  .qa-more{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-radius:11px;border:1px solid var(--border);font-size:12.5px;font-weight:700;color:var(--text-mid);margin-top:2px;cursor:pointer;}
  .qa-more:hover{background:var(--bg);}

  .simple-note{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-mid);font-weight:600;}
  .simple-note i{color:var(--green);font-size:13px;}
  .emg-list{display:flex;flex-direction:column;gap:10px;}
  .emg-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);}
  .emg-row:last-child{border-bottom:none;padding-bottom:0;}
  .emg-label{font-size:11.5px;color:var(--text-light);font-weight:600;}
  .emg-value{font-size:12px;color:var(--text-dark);font-weight:700;text-align:right;max-width:60%;}

  .view-toggle{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px;}
  .view-btn{padding:6px 10px;border-radius:6px;font-size:11px;font-weight:700;color:var(--text-mid);cursor:pointer;transition:all .15s;}
  .view-btn.active{background:var(--blue-accent);color:#fff;}
  .view-btn:hover:not(.active){color:var(--text-dark);}

  .grid-view .two-table-grid{grid-template-columns:1fr 1fr;}
  .list-view .two-table-grid{grid-template-columns:1fr;}

  .empty-state{text-align:center;padding:40px;color:var(--text-light);font-size:13px;}
  .empty-state i{font-size:32px;margin-bottom:10px;display:block;color:var(--border);}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.45);display:none;align-items:center;justify-content:center;z-index:999;padding:20px;}
  .modal-overlay.open{display:flex;}

  @media(max-width:1200px){.profile-grid{grid-template-columns:1fr;}.summary-grid{grid-template-columns:repeat(3,1fr);}.two-table-grid{grid-template-columns:1fr;}}
  @media(max-width:720px){.info-two-col{grid-template-columns:1fr;}.summary-grid{grid-template-columns:repeat(2,1fr);}.contact-grid{gap:18px;}}
</style>
</head>
<body>

<div id="sidebarPlaceholder"></div>

<main class="main">
  <div class="topbar">
    <div class="topbar-left">
      <div class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back</div>
      <div>
        <div class="page-title">Patient Profile</div>
        <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> / <a href="patients.html">Patients</a> / <a href="patients.html">All Patients</a> / Patient Profile</div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="view-toggle">
        <div class="view-btn active" data-view="grid" onclick="setView('grid')"><i class="fa-solid fa-grip"></i></div>
        <div class="view-btn" data-view="list" onclick="setView('list')"><i class="fa-solid fa-list"></i></div>
      </div>
      <div class="btn-outline" onclick="window.print()"><i class="fa-solid fa-print"></i> Print Profile</div>
      <div class="btn-outline" onclick="printCard()"><i class="fa-regular fa-id-card"></i> Print ID Card</div>
      <div class="btn-primary" onclick="printCard()"><i class="fa-solid fa-print"></i> Print</div>
    </div>
  </div>

  <div id="patientHeader"></div>

  <div class="tabs-bar" id="tabsBar">
    <div class="tab-item active" data-tab="overview" onclick="switchTab('overview')">Overview</div>
    <div class="tab-item" data-tab="visits" onclick="switchTab('visits')">Visit History</div>
    <div class="tab-item" data-tab="medical" onclick="switchTab('medical')">Medical History</div>
    <div class="tab-item" data-tab="appointments" onclick="switchTab('appointments')">Appointments</div>
    <div class="tab-item" data-tab="lab" onclick="switchTab('lab')">Lab Results</div>
    <div class="tab-item" data-tab="prescriptions" onclick="switchTab('prescriptions')">Prescriptions</div>
    <div class="tab-item" data-tab="billing" onclick="switchTab('billing')">Billing</div>
    <div class="tab-item" data-tab="notes" onclick="switchTab('notes')">Notes</div>
  </div>

  <div id="tabContent"></div>

<!-- Visit Detail Modal -->
<div class="modal-overlay" id="visitModal">
  <div style="background:#fff;border-radius:14px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.25);padding:0;max-height:80vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #e5e7eb;">
      <div>
        <div style="font-size:16px;font-weight:700;color:#0f172a;" id="vmTitle">Visit Details</div>
        <div style="font-size:12px;color:#94a3b8;" id="vmSub"></div>
      </div>
      <div id="vmCloseBtn" style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#94a3b8;font-size:14px;border:1px solid #e5e7eb;">&#10005;</div>
    </div>
    <div style="padding:20px;" id="vmBody"></div>
  </div>
</div>
</main>

<script src="shiloh-sidebar.js"></script>
<script src="../services/api.js"></script>
<script src="../services/patient-service.js"></script>
<script src="../services/appointment-service.js"></script>
<script src="appointment-form.js"></script>
<script src="appointment-detail.js"></script>
<script>
  let currentTab = 'overview';
  let currentView = 'grid';

  /* ── Init (backend-only, async) ─────────────────────────────────────── */
  document.addEventListener('DOMContentLoaded', async () => {
    ShilohSidebar.attach('#sidebarPlaceholder', {
      activeFile: 'patients.html',
      user: { name: 'Receptionist', role: 'Front Desk', avatar: 'https://i.pravatar.cc/64?img=47' }
    });
    try { await AppointmentService.init(); } catch (e) { window.ShilohAPI.toast('Could not load data. Check connection / login.', 'error'); }
    try { await PatientService.init(); } catch (e) { window.ShilohAPI.toast('Could not load data. Check connection / login.', 'error'); }

    const params = new URLSearchParams(window.location.search);
    const hospNo = params.get('hosp') || 'SHC-000001';
    let success = false, patient = null;
    try {
      const res = await PatientService.loadPatientByHospital(hospNo);
      success = res.success; patient = res.patient;
    } catch (e) { window.ShilohAPI.toast('Could not load data. Check connection / login.', 'error'); }

    if (success && patient) {
      renderHeader(patient);
      await renderTabContent(patient);
    } else {
      window.ShilohAPI.toast('Could not load data. Check connection / login.', 'error');
      document.getElementById('patientHeader').innerHTML = '<div class="panel"><div class="empty-state"><i class="fa-solid fa-user-slash"></i>Patient not found</div></div>';
    }
  });

  /* ── Header ────────────────────────────────────────────────────────── */
  function renderHeader(p) {
    document.getElementById('patientHeader').innerHTML = `
      <div class="patient-card">
        <div class="patient-id-block">
          <div class="patient-photo">
            <img src="https://i.pravatar.cc/160?img=${getAvatarIndex(p)}" alt="${p.name}">
            <div class="photo-edit"><i class="fa-solid fa-camera"></i></div>
          </div>
          <div>
            <div class="patient-name-row">
              <div class="patient-name">${p.name}</div>
              <span class="badge-status"><i class="fa-solid fa-circle"></i> ${p.status}</span>
            </div>
            <div class="hosp-label" style="margin-bottom:2px;">Hospital No.</div>
            <div class="hosp-no-row">
              <div class="hosp-no">${p.hospitalNo}</div>
              <div class="qr-icon-btn" title="Show QR Code"><i class="fa-solid fa-qrcode"></i></div>
            </div>
            <div class="patient-meta-row">
              <div class="meta-item"><i class="fa-regular fa-clock"></i> ${p.age} Years</div>
              <div class="meta-item"><i class="fa-solid fa-venus-mars"></i> ${p.gender}</div>
              <div class="meta-item"><i class="fa-regular fa-calendar"></i> ${p.dateOfBirth}</div>
              <div class="meta-item"><i class="fa-solid fa-droplet"></i> ${p.bloodType}</div>
            </div>
          </div>
        </div>
        <div class="contact-grid">
          <div class="contact-item"><i class="fa-solid fa-phone"></i><div><div class="contact-label">Phone (Primary)</div><div class="contact-value">${p.phonePrimary}</div></div></div>
          <div class="contact-item"><i class="fa-solid fa-phone"></i><div><div class="contact-label">Phone (Secondary)</div><div class="contact-value">${p.phoneSecondary}</div></div></div>
          <div class="contact-item"><i class="fa-regular fa-envelope"></i><div><div class="contact-label">Email</div><div class="contact-value">${p.email}</div></div></div>
          <div class="contact-item"><i class="fa-solid fa-location-dot"></i><div><div class="contact-label">Address</div><div class="contact-value">${p.address}</div></div></div>
          <div class="contact-item"><i class="fa-regular fa-calendar-check"></i><div><div class="contact-label">Last Visit</div><div class="contact-value">${p.lastVisit}</div></div></div>
          <div class="contact-item"><i class="fa-regular fa-clock"></i><div><div class="contact-label">Registered On</div><div class="contact-value">${p.registeredOn}</div></div></div>
        </div>
      </div>`;
  }

  /* ── Tab Switch ────────────────────────────────────────────────────── */
  async function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-item').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    const patient = PatientService.getCurrentPatient();
    if (patient) await renderTabContent(patient);
  }

  /* ── View Toggle ───────────────────────────────────────────────────── */
  function setView(view) {
    currentView = view;
    document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    const content = document.getElementById('tabContent');
    content.classList.toggle('grid-view', view === 'grid');
    content.classList.toggle('list-view', view === 'list');
  }

  /* ── Render Tab Content (backend-only, async) ────────────────────────── */
  async function renderTabContent(p) {
    const el = document.getElementById('tabContent');
    let labTests = [], appointments = [], prescriptions = [], invoices = [];
    try {
      labTests = await PatientService.getPatientLabTests(p.id);
      appointments = await PatientService.getPatientAppointments(p.id);
      prescriptions = await PatientService.getPatientPrescriptions(p.id);
      invoices = await PatientService.getPatientInvoices(p.id);
    } catch (e) { window.ShilohAPI.toast('Could not load data. Check connection / login.', 'error'); }

    const visits = p.visitHistory || [];
    const totalBilled = invoices.reduce((s, i) => s + i.total, 0);
    const totalPaid = invoices.reduce((s, i) => s + i.paid, 0);

    switch(currentTab) {
      case 'overview': el.innerHTML = renderOverview(p, visits, appointments, prescriptions, labTests, invoices, totalBilled, totalPaid); break;
      case 'visits': el.innerHTML = renderVisits(visits); break;
      case 'medical': el.innerHTML = renderMedical(p); break;
      case 'appointments': el.innerHTML = renderAppointments(appointments); break;
      case 'lab': el.innerHTML = renderLab(labTests); break;
      case 'prescriptions': el.innerHTML = renderPrescriptions(prescriptions); break;
      case 'billing': el.innerHTML = renderBilling(invoices, totalBilled, totalPaid); break;
      case 'notes': el.innerHTML = renderNotes(p); break;
    }
    el.classList.toggle('grid-view', currentView === 'grid');
    el.classList.toggle('list-view', currentView === 'list');
  }

  /* ── Overview ──────────────────────────────────────────────────────── */
  function renderOverview(p, visits, appointments, prescriptions, labTests, invoices, totalBilled, totalPaid) {
    return `
    <div class="profile-grid">
      <div class="left-col">
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Demographic Information</div><div class="edit-link" onclick="editPatient()"><i class="fa-solid fa-pen"></i> Edit</div></div>
          <div class="info-two-col">
            <div>
              ${infoRow('Full Name', p.name)}${infoRow('Date of Birth', p.dateOfBirth)}${infoRow('Age', p.age + ' Years')}
              ${infoRow('Gender', p.gender)}${infoRow('Marital Status', p.maritalStatus)}${infoRow('State of Origin', p.stateOfOrigin)}
              ${infoRow('LGA', p.lga)}${infoRow('Religion', p.religion)}
            </div>
            <div>
              ${infoRow('Occupation', p.occupation)}${infoRow('Blood Group', p.bloodType)}${infoRow('Genotype', p.genotype)}
              ${infoRow('Patient Type', p.patientType)}${infoRow('Registered By', p.registeredBy)}
            </div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Contact & Address</div><div class="edit-link" onclick="editPatient()"><i class="fa-solid fa-pen"></i> Edit</div></div>
          <div class="contact-address-grid">
            ${caRow('fa-solid fa-phone', 'Phone (Primary)', p.phonePrimary)}
            ${caRow('fa-solid fa-phone', 'Phone (Secondary)', p.phoneSecondary)}
            ${caRow('fa-regular fa-envelope', 'Email', p.email)}
            <div class="ca-divider"></div>
            ${caRow('fa-solid fa-location-dot', 'Residential Address', p.address)}
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Summary</div></div>
          <div class="summary-grid">
            ${summaryCard('fa-solid fa-user-group', 'var(--purple-bg)', 'var(--purple)', 'Total Visits', visits.length, 'switchTab(\'visits\')')}
            ${summaryCard('fa-regular fa-calendar', 'var(--blue-bg)', 'var(--blue)', 'Appointments', appointments.length, 'switchTab(\'appointments\')')}
            ${summaryCard('fa-solid fa-flask', 'var(--blue-bg)', 'var(--blue)', 'Lab Tests', labTests.length, 'switchTab(\'lab\')')}
            ${summaryCard('fa-solid fa-prescription', 'var(--red-bg)', 'var(--red)', 'Prescriptions', prescriptions.length, 'switchTab(\'prescriptions\')')}
            ${summaryCard('fa-solid fa-file-invoice', 'var(--orange-bg)', 'var(--orange)', 'Total Bills', '₦' + totalBilled.toLocaleString(), 'switchTab(\'billing\')')}
            ${summaryCard('fa-solid fa-sack-dollar', 'var(--green-bg)', 'var(--green)', 'Payments', '₦' + totalPaid.toLocaleString(), 'switchTab(\'billing\')')}
          </div>
        </div>
      </div>
      <div class="right-col">
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Quick Actions</div></div>
          <div class="qa-grid">
            <div class="qa-btn qa-checkin" onclick="checkIn()"><div class="qa-ic"><i class="fa-solid fa-check"></i></div>Check In Patient</div>
            <div class="qa-btn qa-book" onclick="bookAppointment()"><div class="qa-ic"><i class="fa-regular fa-calendar-plus"></i></div>Book Appointment</div>
            <div class="qa-btn qa-visit" onclick="createVisit()"><div class="qa-ic"><i class="fa-solid fa-plus"></i></div>Create Visit</div>
            <div class="qa-btn qa-print" onclick="printCard()"><div class="qa-ic"><i class="fa-solid fa-print"></i></div>Print Patient Card</div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Allergies</div><div class="edit-link" onclick="editPatient()"><i class="fa-solid fa-pen"></i> Edit</div></div>
          <div class="simple-note"><i class="fa-solid ${p.allergies && !p.allergies.includes('No known') ? 'fa-triangle-exclamation' : 'fa-circle-check'}" style="${p.allergies && !p.allergies.includes('No known') ? 'color:var(--orange)' : ''}"></i>${p.allergies || 'No known allergies'}</div>
        </div>
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Chronic Conditions</div><div class="edit-link" onclick="editPatient()"><i class="fa-solid fa-pen"></i> Edit</div></div>
          <div class="simple-note"><i class="fa-solid ${p.chronicConditions && !p.chronicConditions.includes('No') ? 'fa-triangle-exclamation' : 'fa-circle-check'}" style="${p.chronicConditions && !p.chronicConditions.includes('No') ? 'color:var(--orange)' : ''}"></i>${p.chronicConditions || 'No chronic conditions recorded'}</div>
        </div>
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Emergency Contact</div><div class="edit-link" onclick="editPatient()"><i class="fa-solid fa-pen"></i> Edit</div></div>
          <div class="emg-list">
            ${p.emergencyContact ? `
              <div class="emg-row"><span class="emg-label">Name</span><span class="emg-value">${p.emergencyContact.name}</span></div>
              <div class="emg-row"><span class="emg-label">Relationship</span><span class="emg-value">${p.emergencyContact.relationship}</span></div>
              <div class="emg-row"><span class="emg-label">Phone</span><span class="emg-value">${p.emergencyContact.phone}</span></div>
              <div class="emg-row"><span class="emg-label">Address</span><span class="emg-value">${p.emergencyContact.address}</span></div>
            ` : '<div class="simple-note">No emergency contact</div>'}
          </div>
        </div>
      </div>
    </div>`;
  }

  /* ── Visits Tab ────────────────────────────────────────────────────── */
  function renderVisits(visits) {
    return `<div class="panel"><div class="panel-head"><div class="panel-title">Visit History</div></div>
    <table><thead><tr><th>Visit No.</th><th>Date</th><th>Department</th><th>Doctor</th><th>Reason</th><th>Status</th></tr></thead>
    <tbody>${visits.map(v => `<tr onclick="openVisitModal('${v.id}')"><td>${v.id}</td><td>${v.date}</td><td>${v.department}</td><td>${v.doctor}</td><td>${(v.reason||'').slice(0,35)}${(v.reason||'').length>35?'...':''}</td><td><span class="badge-completed">${v.status}</span></td></tr>`).join('') || '<tr><td colspan="6" class="empty-state">No visits found</td></tr>'}</tbody></table></div>`;
  }

  let _currentVisitPatient = null;
  let _currentVisitId = null;

  window.openVisitModal = function(visitId) {
    const p = PatientService.getCurrentPatient();
    if (!p) return;
    const v = (p.visitHistory || []).find(x => x.id === visitId);
    if (!v) return;
    _currentVisitPatient = p;
    _currentVisitId = visitId;
    document.getElementById('vmTitle').textContent = v.id;
    document.getElementById('vmSub').textContent = v.date + ' · ' + v.department;
    document.getElementById('vmBody').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div style="padding:12px;background:#f8fafc;border-radius:10px;border:1px solid #e5e7eb;">
          <div style="font-size:10.5px;color:#94a3b8;font-weight:600;text-transform:uppercase;margin-bottom:4px;">Doctor</div>
          <div style="font-size:13px;font-weight:700;color:#0f172a;">${v.doctor}</div>
        </div>
        <div style="padding:12px;background:#f8fafc;border-radius:10px;border:1px solid #e5e7eb;">
          <div style="font-size:10.5px;color:#94a3b8;font-weight:600;text-transform:uppercase;margin-bottom:4px;">Status</div>
          <div style="font-size:13px;font-weight:700;color:#0a8a52;">${v.status}</div>
        </div>
      </div>
      <div style="margin-top:14px;padding:12px;background:#f8fafc;border-radius:10px;border:1px solid #e5e7eb;">
        <div style="font-size:10.5px;color:#94a3b8;font-weight:600;text-transform:uppercase;margin-bottom:4px;">Reason for Visit</div>
        <div style="font-size:13px;font-weight:600;color:#0f172a;">${v.reason || 'No reason recorded'}</div>
      </div>
      <div style="margin-top:14px;padding:12px;background:#f8fafc;border-radius:10px;border:1px solid #e5e7eb;">
        <div style="font-size:10.5px;color:#94a3b8;font-weight:600;text-transform:uppercase;margin-bottom:4px;">Diagnosis</div>
        <div style="font-size:13px;font-weight:600;color:#0f172a;">${v.diagnosis || 'No diagnosis recorded'}</div>
      </div>
      <div style="margin-top:14px;padding:12px;background:#f8fafc;border-radius:10px;border:1px solid #e5e7eb;">
        <div style="font-size:10.5px;color:#94a3b8;font-weight:600;text-transform:uppercase;margin-bottom:4px;">Clinical Notes</div>
        <div style="font-size:13px;color:#334155;line-height:1.5;">${v.notes || 'No notes recorded'}</div>
      </div>`;
    document.getElementById('visitModal').classList.add('open');
  };

  window.closeVisitModal = function() {
    document.getElementById('visitModal').classList.remove('open');
    _currentVisitId = null;
  };

  document.getElementById('vmCloseBtn').addEventListener('click', closeVisitModal);
  document.getElementById('visitModal').addEventListener('click', function(e) {
    if (e.target === this) closeVisitModal();
  });

  /* ── Medical Tab ───────────────────────────────────────────────────── */
  function renderMedical(p) {
    return `
    <div class="profile-grid" style="grid-template-columns:1fr 1fr;">
      <div class="panel"><div class="panel-head"><div class="panel-title">Allergies</div></div><div class="simple-note"><i class="fa-solid ${p.allergies && !p.allergies.includes('No known') ? 'fa-triangle-exclamation' : 'fa-circle-check'}" style="${p.allergies && !p.allergies.includes('No known') ? 'color:var(--orange)' : ''}"></i>${p.allergies || 'None recorded'}</div></div>
      <div class="panel"><div class="panel-head"><div class="panel-title">Chronic Conditions</div></div><div class="simple-note"><i class="fa-solid ${p.chronicConditions && !p.chronicConditions.includes('No') ? 'fa-triangle-exclamation' : 'fa-circle-check'}" style="${p.chronicConditions && !p.chronicConditions.includes('No') ? 'color:var(--orange)' : ''}"></i>${p.chronicConditions || 'None recorded'}</div></div>
      <div class="panel"><div class="panel-head"><div class="panel-title">Blood Group & Genotype</div></div><div class="info-two-col"><div>${infoRow('Blood Group', p.bloodType)}${infoRow('Genotype', p.genotype)}</div></div></div>
      <div class="panel"><div class="panel-head"><div class="panel-title">Emergency Contact</div></div><div class="emg-list">${p.emergencyContact ? `<div class="emg-row"><span class="emg-label">Name</span><span class="emg-value">${p.emergencyContact.name}</span></div><div class="emg-row"><span class="emg-label">Phone</span><span class="emg-value">${p.emergencyContact.phone}</span></div>` : 'No emergency contact'}</div></div>
    </div>`;
  }

  /* ── Appointments Tab ──────────────────────────────────────────────── */
  function renderAppointments(apts) {
    const APPT_BADGE = { Scheduled:'badge-pending', Confirmed:'badge-completed', Completed:'badge-completed', Cancelled:'badge-pending', 'No-Show':'badge-pending' };
    return `<div class="panel"><div class="panel-head"><div class="panel-title">Appointments (${apts.length})</div><div class="btn-primary" onclick="bookAppointment()" style="font-size:11px;padding:7px 12px;"><i class="fa-solid fa-plus"></i> New</div></div>
    <table><thead><tr><th>ID</th><th>Date</th><th>Time</th><th>Doctor</th><th>Department</th><th>Type</th><th>Status</th></tr></thead>
    <tbody>${apts.map(a => `<tr onclick="AppointmentDetail.open('${a.id}')" style="cursor:pointer"><td>${a.id}</td><td>${a.date}</td><td>${a.time}</td><td>${a.doctor}</td><td>${a.department}</td><td>${a.type}</td><td><span class="${APPT_BADGE[a.status] || 'badge-pending'}">${a.status}</span></td></tr>`).join('') || '<tr><td colspan="7" class="empty-state"><i class="fa-regular fa-calendar-xmark" style="font-size:24px;margin-bottom:8px;display:block;color:var(--border);"></i>No appointments scheduled</td></tr>'}</tbody></table></div>`;
  }

  /* ── Lab Tab ───────────────────────────────────────────────────────── */
  function renderLab(labs) {
    return `<div class="panel"><div class="panel-head"><div class="panel-title">Lab Results</div></div>
    <table><thead><tr><th>Test ID</th><th>Test</th><th>Date</th><th>Ordered By</th><th>Result</th><th>Status</th></tr></thead>
    <tbody>${labs.map(l => `<tr><td>${l.id}</td><td>${l.test}</td><td>${l.date}</td><td>${l.orderedBy}</td><td>${l.result || '—'}</td><td><span class="badge-${l.status.toLowerCase()}">${l.status}</span></td></tr>`).join('') || '<tr><td colspan="6" class="empty-state">No lab tests</td></tr>'}</tbody></table></div>`;
  }

  /* ── Prescriptions Tab ─────────────────────────────────────────────── */
  function renderPrescriptions(rx) {
    return `<div class="panel"><div class="panel-head"><div class="panel-title">Prescriptions</div></div>
    <table><thead><tr><th>Rx No.</th><th>Date</th><th>Doctor</th><th>Medications</th><th>Status</th></tr></thead>
    <tbody>${rx.map(r => `<tr><td>${r.id}</td><td>${r.date}</td><td>${r.doctor}</td><td>${(r.medications||[]).join(', ')}</td><td><span class="badge-${r.status.toLowerCase()}">${r.status}</span></td></tr>`).join('') || '<tr><td colspan="5" class="empty-state">No prescriptions</td></tr>'}</tbody></table></div>`;
  }

  /* ── Billing Tab ───────────────────────────────────────────────────── */
  function renderBilling(invoices, totalBilled, totalPaid) {
    const outstanding = totalBilled - totalPaid;
    return `
    <div class="summary-grid" style="margin-bottom:16px;grid-template-columns:repeat(3,1fr);">
      ${summaryCard('fa-solid fa-file-invoice', 'var(--orange-bg)', 'var(--orange)', 'Total Billed', '₦' + totalBilled.toLocaleString())}
      ${summaryCard('fa-solid fa-sack-dollar', 'var(--green-bg)', 'var(--green)', 'Total Paid', '₦' + totalPaid.toLocaleString())}
      ${summaryCard('fa-solid fa-clock', 'var(--red-bg)', 'var(--red)', 'Outstanding', '₦' + outstanding.toLocaleString())}
    </div>
    <div class="panel"><div class="panel-head"><div class="panel-title">Invoices</div></div>
    <table><thead><tr><th>Invoice</th><th>Date</th><th>Items</th><th>Total</th><th>Paid</th><th>Status</th></tr></thead>
    <tbody>${invoices.map(i => `<tr><td>${i.id}</td><td>${i.date}</td><td>${i.items.join(', ')}</td><td>₦${i.total.toLocaleString()}</td><td>₦${i.paid.toLocaleString()}</td><td><span class="badge-${i.status.toLowerCase()}">${i.status}</span></td></tr>`).join('') || '<tr><td colspan="6" class="empty-state">No invoices</td></tr>'}</tbody></table></div>`;
  }

  /* ── Notes Tab ─────────────────────────────────────────────────────── */
  function renderNotes(p) {
    return `<div class="panel"><div class="panel-head"><div class="panel-title">Clinical Notes</div><div class="edit-link"><i class="fa-solid fa-plus"></i> Add Note</div></div>
    <div class="empty-state"><i class="fa-solid fa-notes-medical"></i>No clinical notes recorded for this patient.</div></div>`;
  }

  /* ── Actions ───────────────────────────────────────────────────────── */
  function checkIn() { const p = PatientService.getCurrentPatient(); window.location.href = 'visits.html?checkin=' + encodeURIComponent(p.hospitalNo); }
  function bookAppointment() {
    const p = PatientService.getCurrentPatient();
    AppointmentForm.open({
      patientId: p.id,
      patientName: p.name,
      hospitalNo: p.hospitalNo,
      onCreated: (appt) => { showToast('Appointment booked: ' + appt.id); }
    });
  }
  function createVisit() { const p = PatientService.getCurrentPatient(); window.location.href = 'visits.html?new=' + encodeURIComponent(p.hospitalNo); }
  function printCard() { window.print(); }
  function editPatient() { alert('Edit patient — coming soon'); }

  /* ── Helpers ───────────────────────────────────────────────────────── */
  function infoRow(label, value) { return `<div class="info-row"><span class="info-label">${label}</span><span class="info-value">${value || '—'}</span></div>`; }
  function caRow(icon, label, value) { return `<div class="ca-row"><div class="ca-ic"><i class="${icon}"></i></div><div><div class="ca-label">${label}</div><div class="ca-value">${value || '—'}</div></div></div>`; }
  function summaryCard(icon, bg, color, label, value, onclick) {
    return `<div class="summary-card" ${onclick ? `onclick="${onclick}"` : ''}>
      <div class="summary-ic" style="background:${bg};color:${color};"><i class="${icon}"></i></div>
      <div class="summary-label">${label}</div>
      <div class="summary-value">${value}</div>
    </div>`;
  }
  function getAvatarIndex(p) {
    const idx = parseInt(p.id.split('-')[1]) || 1;
    return 10 + (idx % 40);
  }
</script>
</body>
</html>
