<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shiloh Clinic & Maternity - Patients</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --blue:#2563eb; --blue-light:#eef2ff;
    --text-dark:#1e293b; --text-gray:#64748b; --border:#e5e7eb; --bg:#f5f6f8;
    --green:#16a34a; --green-bg:#dcfce7;
    --orange:#f97316; --orange-bg:#fff1e6;
    --purple:#8b5cf6; --purple-bg:#f1eaff;
    --pink:#ec4899; --pink-bg:#fde8f2;
    --red:#f04438; --red-bg:#feecec;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-dark);display:flex;min-height:100vh;}
  .main{flex:1;padding:22px 28px;overflow-x:auto;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;}
  .page-title{font-size:22px;font-weight:700;color:#0f172a;}
  .breadcrumb{font-size:12.5px;color:var(--text-gray);margin-top:4px;}
  .breadcrumb a{color:var(--blue);text-decoration:none;}
  .topbar-actions{display:flex;gap:10px;}
  .btn{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:#fff;color:#334155;white-space:nowrap;transition:all .15s;}
  .btn:hover{background:var(--bg);}
  .btn-primary{background:var(--blue);color:#fff;border:1px solid var(--blue);}
  .btn-primary:hover{background:#1d4ed8;}

  .stats-row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px;}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
  .stat-top{display:flex;align-items:center;gap:10px;}
  .stat-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
  .stat-label{font-size:12px;color:var(--text-gray);font-weight:500;}
  .stat-value{font-size:20px;font-weight:700;color:#0f172a;}
  .stat-sub{font-size:10.5px;color:#94a3b8;margin-top:-4px;}
  .icon-blue{background:var(--blue-light);color:var(--blue);}
  .icon-green{background:var(--green-bg);color:var(--green);}
  .icon-orange{background:var(--orange-bg);color:var(--orange);}
  .icon-purple{background:var(--purple-bg);color:var(--purple);}
  .icon-blue2{background:#e0edff;color:#2563eb;}
  .icon-pink{background:var(--pink-bg);color:var(--pink);}

  .filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .search-box{flex:1;min-width:260px;position:relative;}
  .search-box input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;outline:none;}
  .search-box input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,0.1);}
  .search-box i{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;}
  .filter-group{display:flex;flex-direction:column;gap:3px;}
  .filter-group label{font-size:11.5px;color:var(--text-gray);font-weight:500;}
  .filter-select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;min-width:100px;color:#334155;outline:none;}
  .filter-select:focus{border-color:var(--blue);}

  .table-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .table-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;}
  .table-title{font-size:15px;font-weight:700;color:#0f172a;}
  .table-actions{display:flex;gap:8px;align-items:center;}
  .view-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .view-btn{width:34px;height:34px;border:none;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#64748b;font-size:13px;transition:all .1s;}
  .view-btn.active{background:var(--blue-light);color:var(--blue);}

  table{width:100%;border-collapse:collapse;}
  thead tr{border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:#fafbfc;}
  th{text-align:left;padding:11px 12px;font-size:11.5px;color:#64748b;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;}
  th:hover{color:var(--text-dark);}
  td{padding:11px 12px;font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap;color:#334155;}
  tbody tr{cursor:pointer;transition:background .1s;}
  tbody tr:hover{background:#f8fafc;}
  .patient-cell{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
  .avatar{width:34px;height:34px;border-radius:50%;background-size:cover;background-position:center;flex-shrink:0;}
  .patient-name{font-weight:600;color:#0f172a;font-size:13px;}
  .patient-email{font-size:11.5px;color:#94a3b8;}
  .gender-male{color:#2563eb;font-weight:500;}
  .gender-female{color:#ec4899;font-weight:500;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge-outpatient{background:#dcfce7;color:#16a34a;}
  .badge-active{background:#dcfce7;color:#16a34a;}
  .row-actions{display:flex;gap:6px;align-items:center;}
  .icon-btn{width:30px;height:30px;border:1px solid var(--border);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#64748b;font-size:12px;transition:all .1s;}
  .icon-btn:hover{background:var(--bg);color:var(--blue);}

  .table-footer{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;}
  .footer-text{font-size:12.5px;color:var(--text-gray);}
  .pagination{display:flex;gap:6px;align-items:center;}
  .page-btn{width:32px;height:32px;border:1px solid var(--border);border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;color:#334155;cursor:pointer;transition:all .1s;}
  .page-btn:hover:not(.active){background:var(--bg);}
  .page-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  .per-page{padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;color:#334155;}

  .empty-row td{text-align:center;padding:40px;color:var(--text-gray);font-size:13px;}

  @media(max-width:1200px){.stats-row{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:768px){.stats-row{grid-template-columns:repeat(2,1fr);}.filter-bar{flex-direction:column;}.search-box{min-width:100%;}}
  .btn.loading{pointer-events:none;opacity:.7;}
  .btn.loading::after{content:'';width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:phspin .6s linear infinite;margin-left:6px;display:inline-block;vertical-align:middle;}
  .btn:not(.btn-primary).loading::after{border-color:rgba(0,0,0,.15);border-top-color:var(--blue);}
  @keyframes phspin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="sidebarPlaceholder"></div>

<div class="main">
  <div class="topbar">
    <div>
      <div class="page-title">Patients</div>
      <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> / Patients / All Patients</div>
    </div>
    <div class="topbar-actions">
      <div class="btn" onclick="importPatients()"><i class="fa-solid fa-upload"></i> Import Patients</div>
      <div class="btn btn-primary" onclick="registerPatient()"><i class="fa-solid fa-plus"></i> Register New Patient</div>
      <div class="btn" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</div>
    </div>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div class="filter-bar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by name, hospital no., phone, email..." oninput="filterPatients()">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>
    <div class="filter-group">
      <label>Gender</label>
      <select class="filter-select" id="filterGender" onchange="filterPatients()">
        <option value="all">All</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Status</label>
      <select class="filter-select" id="filterStatus" onchange="filterPatients()">
        <option value="all">All</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Blood Group</label>
      <select class="filter-select" id="filterBlood" onchange="filterPatients()">
        <option value="all">All</option>
        <option value="A+">A+</option><option value="A-">A-</option>
        <option value="B+">B+</option><option value="B-">B-</option>
        <option value="O+">O+</option><option value="O-">O-</option>
        <option value="AB+">AB+</option><option value="AB-">AB-</option>
      </select>
    </div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <div class="table-title" id="tableTitle">All Patients</div>
      <div class="table-actions">
        <div class="btn" onclick="exportPatients()"><i class="fa-solid fa-download"></i> Export</div>
        <div class="view-toggle">
          <div class="view-btn active" data-view="list" onclick="setView('list')"><i class="fa-solid fa-list"></i></div>
          <div class="view-btn" data-view="grid" onclick="setView('grid')"><i class="fa-solid fa-grip"></i></div>
        </div>
      </div>
    </div>

    <div id="tableView">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th onclick="sortBy('name')">Patient <i class="fa-solid fa-sort" style="font-size:9px;margin-left:4px;"></i></th>
            <th onclick="sortBy('hospitalNo')">Hospital No.</th>
            <th onclick="sortBy('phonePrimary')">Phone</th>
            <th onclick="sortBy('gender')">Gender</th>
            <th onclick="sortBy('age')">Age</th>
            <th>Patient Type</th>
            <th onclick="sortBy('lastVisit')">Last Visit</th>
            <th onclick="sortBy('status')">Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="patientTable"></tbody>
      </table>
    </div>

    <div id="gridView" style="display:none;padding:20px;"></div>

    <div class="table-footer">
      <div class="footer-text" id="footerText">Showing 0 patients</div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<script src="shiloh-sidebar.js"></script>
<script src="../services/api.js"></script>
<script src="../services/patient-service.js"></script>
<script>
  let allPatients = [];
  let filteredPatients = [];
  let currentPage = 1;
  let perPage = 10;
  let sortField = 'name';
  let sortDir = 'asc';
  let currentView = 'list';

  document.addEventListener('DOMContentLoaded', async () => {
    ShilohSidebar.attach('#sidebarPlaceholder', {
      activeFile: 'patients.html',
      user: { name: 'Receptionist', role: 'Front Desk', avatar: 'https://i.pravatar.cc/64?img=47' }
    });

    await PatientService.init();
    allPatients = PatientService.getAllPatients();
    filteredPatients = [...allPatients];
    renderStats();
    renderTable();
  });

  /* ── Stats ──────────────────────────────────────────────────────────── */
  function renderStats() {
    const total = allPatients.length;
    const active = allPatients.filter(p => p.status === 'Active').length;
    const inactive = total - active;
    const male = allPatients.filter(p => p.gender === 'Male').length;
    const female = allPatients.filter(p => p.gender === 'Female').length;
    const now = new Date();
    const thisMonth = allPatients.filter(p => {
      const d = new Date(p.registeredOn);
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }).length;

    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card"><div class="stat-top"><div class="stat-icon icon-blue"><i class="fa-solid fa-user-group"></i></div><div class="stat-label">Total Patients</div></div><div class="stat-value">${total}</div></div>
      <div class="stat-card"><div class="stat-top"><div class="stat-icon icon-green"><i class="fa-solid fa-user-check"></i></div><div class="stat-label">Active Patients</div></div><div class="stat-value">${active}</div><div class="stat-sub">${total ? Math.round(active/total*100) : 0}% of total</div></div>
      <div class="stat-card"><div class="stat-top"><div class="stat-icon icon-orange"><i class="fa-solid fa-user-xmark"></i></div><div class="stat-label">Inactive Patients</div></div><div class="stat-value">${inactive}</div><div class="stat-sub">${total ? Math.round(inactive/total*100) : 0}% of total</div></div>
      <div class="stat-card"><div class="stat-top"><div class="stat-icon icon-purple"><i class="fa-regular fa-calendar-plus"></i></div><div class="stat-label">New This Month</div></div><div class="stat-value">${thisMonth}</div></div>
      <div class="stat-card"><div class="stat-top"><div class="stat-icon icon-blue2"><i class="fa-solid fa-mars"></i></div><div class="stat-label">Male</div></div><div class="stat-value">${male}</div><div class="stat-sub">${total ? Math.round(male/total*100) : 0}%</div></div>
      <div class="stat-card"><div class="stat-top"><div class="stat-icon icon-pink"><i class="fa-solid fa-venus"></i></div><div class="stat-label">Female</div></div><div class="stat-value">${female}</div><div class="stat-sub">${total ? Math.round(female/total*100) : 0}%</div></div>
    `;
  }

  /* ── Filter ─────────────────────────────────────────────────────────── */
  function filterPatients() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const gender = document.getElementById('filterGender').value;
    const status = document.getElementById('filterStatus').value;
    const blood = document.getElementById('filterBlood').value;

    filteredPatients = allPatients.filter(p => {
      if (q && !p.name.toLowerCase().includes(q) && !p.hospitalNo.toLowerCase().includes(q) && !p.phonePrimary.includes(q) && !p.email.toLowerCase().includes(q)) return false;
      if (gender !== 'all' && p.gender !== gender) return false;
      if (status !== 'all' && p.status !== status) return false;
      if (blood !== 'all' && p.bloodType !== blood) return false;
      return true;
    });

    currentPage = 1;
    renderTable();
  }

  /* ── Sort ───────────────────────────────────────────────────────────── */
  function sortBy(field) {
    if (sortField === field) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
    else { sortField = field; sortDir = 'asc'; }

    filteredPatients.sort((a, b) => {
      let va = a[field] || '', vb = b[field] || '';
      if (field === 'age') { va = parseInt(va); vb = parseInt(vb); }
      if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
      return sortDir === 'asc' ? va - vb : vb - va;
    });
    renderTable();
  }

  /* ── View Toggle ────────────────────────────────────────────────────── */
  function setView(view) {
    currentView = view;
    document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    document.getElementById('tableView').style.display = view === 'list' ? '' : 'none';
    document.getElementById('gridView').style.display = view === 'grid' ? '' : 'none';
    renderTable();
  }

  /* ── Render Table ───────────────────────────────────────────────────── */
  function renderTable() {
    const start = (currentPage - 1) * perPage;
    const page = filteredPatients.slice(start, start + perPage);
    const total = filteredPatients.length;
    const totalPages = Math.ceil(total / perPage);

    document.getElementById('tableTitle').textContent = `All Patients (${total})`;
    document.getElementById('footerText').textContent = `Showing ${total ? start + 1 : 0} to ${Math.min(start + perPage, total)} of ${total} patients`;

    if (currentView === 'list') {
      const tbody = document.getElementById('patientTable');
      if (page.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="10"><i class="fa-solid fa-users-slash" style="font-size:24px;display:block;margin-bottom:8px;"></i>No patients found</td></tr>';
      } else {
        tbody.innerHTML = page.map((p, i) => {
          const idx = start + i + 1;
          const gClass = p.gender === 'Male' ? 'gender-male' : 'gender-female';
          const avatarIdx = 10 + (parseInt(p.id.split('-')[1]) % 40);
          return `<tr onclick="goToProfile('${p.hospitalNo}')">
            <td>${idx}</td>
            <td><div class="patient-cell"><div class="avatar" style="background-image:url('https://i.pravatar.cc/80?img=${avatarIdx}')"></div><div><div class="patient-name">${p.name}</div><div class="patient-email">${p.email}</div></div></div></td>
            <td>${p.hospitalNo}</td>
            <td>${p.phonePrimary}</td>
            <td><span class="${gClass}">${p.gender}</span></td>
            <td>${p.age} Yrs</td>
            <td><span class="badge badge-outpatient">${p.patientType}</span></td>
            <td>${p.lastVisit}</td>
            <td><span class="badge badge-active">${p.status}</span></td>
            <td><div class="row-actions"><div class="icon-btn" onclick="event.stopPropagation();goToProfile('${p.hospitalNo}')" title="View"><i class="fa-solid fa-eye"></i></div><div class="icon-btn" onclick="event.stopPropagation()" title="More"><i class="fa-solid fa-ellipsis-vertical"></i></div></div></td>
          </tr>`;
        }).join('');
      }
    } else {
      const grid = document.getElementById('gridView');
      if (page.length === 0) {
        grid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-gray);"><i class="fa-solid fa-users-slash" style="font-size:24px;display:block;margin-bottom:8px;"></i>No patients found</div>';
      } else {
        grid.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;">${page.map(p => {
          const avatarIdx = 10 + (parseInt(p.id.split('-')[1]) % 40);
          return `<div class="stat-card" style="cursor:pointer;" onclick="goToProfile('${p.hospitalNo}')">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
              <div class="avatar" style="background-image:url('https://i.pravatar.cc/80?img=${avatarIdx}');width:44px;height:44px;"></div>
              <div><div style="font-weight:700;color:#0f172a;font-size:13px;">${p.name}</div><div style="font-size:11.5px;color:#94a3b8;">${p.hospitalNo}</div></div>
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-gray);">
              <span><i class="fa-solid fa-phone" style="margin-right:4px;"></i>${p.phonePrimary}</span>
              <span><i class="fa-solid fa-droplet" style="margin-right:4px;"></i>${p.bloodType}</span>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:8px;">
              <span class="badge badge-active">${p.status}</span>
              <span style="font-size:11px;color:var(--text-gray);">Last: ${p.lastVisit}</span>
            </div>
          </div>`;
        }).join('')}</div>`;
      }
    }

    renderPagination(totalPages);
  }

  /* ── Pagination ─────────────────────────────────────────────────────── */
  function renderPagination(totalPages) {
    const el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }

    let html = `<div class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'style="opacity:0.4;pointer-events:none;"' : ''}><i class="fa-solid fa-chevron-left" style="font-size:10px;"></i></div>`;

    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
        html += `<div class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</div>`;
      } else if (i === currentPage - 2 || i === currentPage + 2) {
        html += '<div class="page-btn" style="pointer-events:none;">...</div>';
      }
    }

    html += `<div class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'style="opacity:0.4;pointer-events:none;"' : ''}><i class="fa-solid fa-chevron-right" style="font-size:10px;"></i></div>`;
    html += `<select class="per-page" onchange="changePerPage(this.value)"><option value="10" ${perPage===10?'selected':''}>10</option><option value="25" ${perPage===25?'selected':''}>25</option><option value="50" ${perPage===50?'selected':''}>50</option></select>`;
    el.innerHTML = html;
  }

  function goPage(page) {
    const totalPages = Math.ceil(filteredPatients.length / perPage);
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    renderTable();
  }

  function changePerPage(val) {
    perPage = parseInt(val);
    currentPage = 1;
    renderTable();
  }

  /* ── Actions ────────────────────────────────────────────────────────── */
  function goToProfile(hospNo) { window.location.href = 'patient-profile.html?hosp=' + encodeURIComponent(hospNo); }
  function registerPatient() { window.location.href = 'registration.html'; }
  function importPatients() { alert('Import patients — coming soon'); }
  function exportPatients() { alert('Export patients — coming soon'); }
</script>
</body>
</html>
